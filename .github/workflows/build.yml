name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: SDK WebView2 (NuGet)
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "$env:RUNNER_TEMP/nuget"

      - name: Configuration
        shell: pwsh
        run: |
          $loc = "$env:RUNNER_TEMP/nuget" -replace '\\','/'
          cmake -B build -G "Visual Studio 17 2022" -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$loc"

      - name: Compilation
        run: cmake --build build --config Release --target OpenGroove_VST3 OpenGroove_Standalone --parallel

      - name: Paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/OpenGroove_artefacts/Release/VST3/Open Groove.vst3" out/
          Copy-Item "build/OpenGroove_artefacts/Release/Standalone/Open Groove.exe" out/
          Copy-Item README.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: OpenGroove-Windows
          path: out

      - name: Publier sur la branche builds
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath "$env:RUNNER_TEMP/OpenGroove-Windows.zip" -Force
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan builds-tmp
          git rm -rf --cached . | Out-Null
          Copy-Item "$env:RUNNER_TEMP/OpenGroove-Windows.zip" .
          git add -f OpenGroove-Windows.zip
          git commit -m "Build Windows ${{ github.sha }}"
          git push -f origin HEAD:refs/heads/builds

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configuration
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Compilation
        run: cmake --build build --config Release --target OpenGroove_VST3 OpenGroove_AU -- -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGroove-macOS
          path: |
            build/OpenGroove_artefacts/Release/VST3/Open Groove.vst3
            build/OpenGroove_artefacts/Release/AU/Open Groove.component

  release:
    # Publie les fichiers prêts à installer sur la page « Releases » du dépôt (version « latest »)
    if: github.ref == 'refs/heads/main'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Archives
        run: |
          cd dl/OpenGroove-Windows && zip -qr ../../OpenGroove-Windows.zip . && cd ../..
          cd dl/OpenGroove-macOS && zip -qr ../../OpenGroove-macOS.zip . && cd ../..
          ls -la *.zip

      - name: Release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OpenGroove-Windows.zip OpenGroove-macOS.zip \
            --target "${{ github.sha }}" \
            --title "Open Groove (dernière version)" \
            --notes "Compilé automatiquement depuis le commit ${{ github.sha }}. Télécharge **OpenGroove-Windows.zip** (ou **OpenGroove-macOS.zip**), puis suis la section Installer du README." \
            --latest
