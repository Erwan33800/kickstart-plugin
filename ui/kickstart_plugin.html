/* Fenêtre 1120 x 740, redimensionnable. En-tête (logo, barre du beat, onglets Pattern / Style & kit), un grand panneau,
   barre d'actions. Onglet Pattern : Rack (2 banques de 16 pads) au-dessus du séquenceur et de sa bande de réglages.
   Look plat, tuiles arrondies, nom d'instrument coloré, un seul accent selon le type. */
:root{
  --bg:#151516; --panel:#1d1d1f; --tile:#2a2a2d; --tile-hi:#343438; --cell:#28282b; --cell-beat:#313135; --line:#2c2c30;
  --fg:#f1f0ee; --dim:#a4a4aa; --faint:#6f6f77;
  --classic:#5fd4b8; --surprise:#a98cf5; --drop:#ff6b57; --break:#f5b94d; --hit:var(--classic);
  --sans:"Manrope","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;min-width:980px;min-height:620px;overflow:hidden;background:var(--bg);color:var(--fg);font:500 13px/1.35 var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
body[data-mode="surprise"]{--hit:var(--surprise)} body[data-mode="drop"]{--hit:var(--drop)} body[data-mode="break"]{--hit:var(--break)}
button{font:inherit;color:inherit;margin:0;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--fg);outline-offset:1px}
.win{height:100%;display:grid;grid-template-rows:54px minmax(0,1fr) 74px}
.lab{font-size:11px;font-weight:600;color:var(--faint);white-space:nowrap}

/* en-tête */
.top{display:flex;align-items:center;gap:12px;padding:0 14px;min-width:0}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.07em;font-size:14px;width:148px;flex:none}
.mark{width:26px;height:26px;border-radius:6px;border:1.8px solid var(--hit);display:grid;place-items:center;transition:border-color .25s}
.mark svg{width:15px;height:15px;stroke:var(--hit);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
.beatbar{flex:1;min-width:0;height:32px;border-radius:8px;border:0;background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 12px;font-size:12px;color:var(--dim);text-align:left}
.beatbar:hover{background:var(--tile)}
.beatbar svg{width:14px;height:14px;flex:none;stroke:var(--faint);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.beatbar b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.beatbar .sd{margin-left:auto;font:11px var(--mono);color:var(--faint)}
.tabs{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--panel)}
.tab{border:0;background:none;color:var(--faint);height:28px;padding:0 13px;border-radius:7px;font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--tile-hi);color:var(--fg)}
.sq{display:flex;align-items:center;gap:6px}
.readout{display:flex;align-items:center;gap:7px;height:32px;padding:0 4px 0 2px;font:12px var(--mono);color:var(--faint)}
.readout b{color:var(--fg);font-weight:500}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--tile-hi)}
.readout.on .tdot{background:var(--hit)}
.ib{width:32px;height:32px;border:0;background:var(--panel);border-radius:8px;display:grid;place-items:center;color:var(--dim);padding:0}
.ib:hover:not(:disabled){color:var(--fg);background:var(--tile)}
.ib:disabled{opacity:.3;cursor:default}
.ib svg{width:15px;height:15px}
.ib[aria-pressed="true"]{color:var(--hit)}
.ib[aria-pressed="true"] .off,.ib[aria-pressed="false"] .on{display:none}

/* panneau principal */
.mid{display:grid;padding:0 14px 12px;min-height:0}
.seq{display:grid;grid-template-rows:minmax(0,1fr);min-width:0;min-height:0}
.view{min-height:0;min-width:0;position:relative}
.panel{background:var(--panel);border-radius:10px;padding:12px 16px}
#vSeq{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}
#vSeq>.panel:last-child{min-height:0;display:grid;grid-template-rows:minmax(0,1fr)}
.sec{display:grid;gap:8px}

/* tuiles */
.tile{border:0;background:var(--tile);border-radius:8px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:7px 10px 8px;color:var(--fg);transition:background .1s}
.tile small{font:500 10.5px var(--mono);color:var(--faint)}
.tile b{font-size:12.5px;font-weight:600;line-height:1.1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tile:hover{background:var(--tile-hi)}
.tile:active{transform:scale(.98)}
.tile[aria-checked="true"]{background:var(--hit);color:#101012}
.tile[aria-checked="true"] small{color:#101012;opacity:.6}
.pads{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.sty{height:58px}

/* bande de réglages du séquenceur */
.seqv{display:grid;grid-template-rows:auto auto 18px minmax(0,1fr);gap:0;min-height:0}
.seqv>.strip{grid-row:1}
.seqv>.derive{grid-row:2;margin-top:8px}
.seqv>.ruler{grid-row:3;margin-top:10px}
.seqv>.rows{grid-row:4;margin-top:4px}
.strip{display:flex;align-items:center;gap:16px;min-width:0}
.fld{display:flex;align-items:center;gap:8px;position:relative}
.segc{display:flex;gap:2px;padding:2px;border-radius:7px;background:var(--bg)}
.segc button{border:0;background:none;height:26px;padding:0 12px;border-radius:5px;color:var(--faint);font-weight:600;font-size:12px}
.segc button:hover{color:var(--fg)}
.segc button[aria-checked="true"]{background:var(--hit);color:#101012}
.vb{position:relative;height:28px;min-width:54px;padding:0 11px;border-radius:7px;background:var(--tile);display:flex;align-items:center;justify-content:center;font:500 12px var(--mono);cursor:ns-resize;overflow:hidden;touch-action:none;color:var(--fg)}
.vb:hover,.vb.drag{background:var(--tile-hi)}
.vb .pbar{position:absolute;left:0;bottom:0;height:2px;background:var(--faint)}
.vb.drag .pbar{background:var(--hit)}
.vb.sel{cursor:pointer;justify-content:space-between;gap:10px;min-width:122px;font:600 12px var(--sans);border:0}
.vb.sel svg{width:10px;height:10px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu{position:absolute;top:34px;left:0;min-width:200px;padding:4px;border-radius:9px;background:var(--tile-hi);box-shadow:0 10px 28px rgba(0,0,0,.55);z-index:20;display:grid;gap:1px}
.mi{border:0;background:none;height:28px;border-radius:6px;padding:0 10px;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:12.5px;font-weight:600;text-align:left}
.mi small{font:10.5px var(--mono);color:var(--faint);font-weight:400}
.mi:hover{background:var(--tile)}
.mi[aria-checked="true"]{color:var(--hit)}
.kitlink{margin-left:auto;border:0;background:var(--tile);height:28px;border-radius:7px;padding:0 12px;font-size:12px;color:var(--dim);white-space:nowrap}
.kitlink b{color:var(--fg);font-weight:600}
.kitlink:hover{background:var(--tile-hi)}
.derive{display:flex;align-items:center;gap:10px;font-size:12px;height:20px}
.derive .tag{color:var(--hit);font-weight:700}
.link{border:0;background:none;color:var(--dim);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--tile-hi);padding:0;font-size:12px}
.link:hover{color:var(--fg)}

/* séquenceur */
.ruler{display:grid;column-gap:2px;align-items:end}
.ruler span{font:10px var(--mono);color:var(--faint);padding-left:2px;white-space:nowrap}
.ruler .bn{color:var(--dim);font-weight:600}
.rows{display:flex;flex-direction:column;gap:3px;min-height:0;overflow-y:auto;scrollbar-width:thin}
.rw{display:grid;column-gap:2px;align-items:stretch;flex:1 1 0;min-height:17px;max-height:32px}
.gsep{flex:none;height:4px}
.th{display:flex;align-items:center;gap:6px;padding-right:6px;min-width:0}
.tn{border:0;background:none;padding:0;text-align:left;font-size:12.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c)}
.tn:hover{filter:brightness(1.2)}
.nt{font:10px var(--mono);color:var(--faint)}
.tb{width:20px;height:20px;border:0;border-radius:4px;background:none;color:var(--faint);display:grid;place-items:center;padding:0;opacity:.6}
.tb svg{width:12px;height:12px}
.tb:hover{opacity:1;color:var(--fg);background:var(--tile)}
.tb[aria-pressed="true"]{opacity:1}
.tb.lock[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tb.mute[aria-pressed="true"]{color:var(--drop);background:color-mix(in oklab,var(--drop) 16%,transparent)}
.rw.muted .tn{color:var(--faint);text-decoration:line-through}
.empty{color:var(--dim);padding:20px 0;margin:0}
.c{border-radius:3px;background:var(--cell);position:relative;overflow:hidden;cursor:pointer;min-width:0}
.c.q{background:var(--cell-beat)}
.c::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--hit);opacity:var(--v,0);transition:opacity .12s,background .25s}
.c:hover{box-shadow:inset 0 0 0 1px var(--faint)}
.c.now{box-shadow:inset 0 0 0 1px var(--fg)}
.c.now::after{filter:brightness(1.3)}
.rw.muted .c{opacity:.3}
.gb{margin-left:3px}.gB{margin-left:10px}
.grid.fresh .c::after{animation:pop .3s ease-out both;animation-delay:calc(var(--col)*4ms)}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* style & kit */
.pane{display:grid;gap:20px;align-content:start;height:100%;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pre{border:0;background:var(--tile);border-radius:999px;padding:5px 13px;color:var(--dim);font-size:12px;font-weight:600}
.pre:hover{background:var(--tile-hi);color:var(--fg)}
.pre[aria-pressed="true"]{background:var(--hit);color:#101012}
.kg{display:grid;grid-template-columns:90px 1fr;gap:10px 14px;align-items:center}
.chip{height:34px;border-radius:8px;border:0;background:var(--tile);padding:0 14px;color:var(--faint);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:9px}
.chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--tile-hi)}
.chip:hover{background:var(--tile-hi)}
.chip[aria-pressed="true"]{color:var(--c)}
.chip[aria-pressed="true"]::before{background:var(--c)}

/* rack */
.rackv{display:grid;gap:9px}
.rackh{display:flex;align-items:center;gap:12px}
.rackh .fld{margin-left:auto}
#rackBtn{min-width:150px}
#rackMenu{left:auto;right:0;min-width:260px}
.pgrid{display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:58px;gap:6px}
.mp{border-radius:8px;background:var(--tile);display:flex;flex-direction:column;justify-content:space-between;padding:6px 10px 8px;min-width:0;min-height:0;position:relative;cursor:pointer;transition:background .1s}
.mp small{font:500 10.5px var(--mono);color:var(--dim)}
.mp .slot{display:flex;flex-direction:column;gap:1px;min-height:0;align-items:flex-start}
.mp.free{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.mp.free .slot::after{content:"vide";color:var(--faint);font-size:12px}
.mp.over{background:var(--hit)}
.mp.over small,.mp.over .slot::after{color:#101012}
.mp.hl{box-shadow:inset 0 0 0 1.5px var(--hit)}
.mp.hit::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--fg);opacity:.22;animation:fl .2s ease-out forwards;pointer-events:none}
@keyframes fl{to{opacity:0}}
.chg{position:absolute;top:4px;right:5px;width:22px;height:22px;border:0;border-radius:5px;background:none;color:var(--faint);display:grid;place-items:center;padding:0}
.chg svg{width:10px;height:10px}
.mp:hover .chg{color:var(--fg);background:rgba(255,255,255,.08)}
.mp.over .chg{color:#101012}
.pick{top:calc(100% + 4px);width:480px;grid-template-columns:repeat(3,1fr);padding:6px;gap:1px 6px;max-height:300px;overflow:auto}
.pick.r{left:auto;right:0}
.pick .mi[aria-checked="true"]{background:var(--tile)}
.pel{display:inline-flex;align-items:center;gap:5px;color:var(--c);font-size:13px;font-weight:700;cursor:grab;touch-action:none;white-space:nowrap;user-select:none;line-height:1.25}
.pel:hover{filter:brightness(1.25)}
.mp.over .pel{color:#101012}
.pel.ghost{position:fixed;z-index:50;pointer-events:none;cursor:grabbing;background:var(--tile-hi);padding:6px 12px;border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.6);transform:translate(-14px,-14px) rotate(-2deg)}
.pel.src{opacity:.25}
.tog{display:inline-flex;align-items:center;gap:9px;border:0;background:none;padding:0;font-size:12.5px;color:var(--fg);font-weight:600}
.tog i{width:30px;height:16px;border-radius:99px;background:var(--tile-hi);position:relative;transition:.15s}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--dim);transition:.15s}
.tog[aria-checked="true"] i{background:var(--hit)}
.tog[aria-checked="true"] i::after{transform:translateX(14px);background:#101012}

/* barre d'actions */
.act{display:flex;align-items:center;gap:12px;padding:0 14px}
.gen{height:50px;width:180px;border:0;border-radius:10px;background:var(--hit);color:#101012;font-weight:800;font-size:15px;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .06s,background .25s}
.gen:hover{filter:brightness(1.08)}
.gen:active{transform:scale(.98)}
.gen kbd,.dropb kbd{font:500 10.5px var(--mono);border-radius:4px;padding:1px 6px;background:rgba(0,0,0,.18)}
.dropb,.brkb{height:50px;width:150px;border-radius:10px;border:0;background:color-mix(in oklab,var(--drop) 14%,var(--panel));color:var(--drop);font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:9px}
.dropb kbd{background:color-mix(in oklab,var(--drop) 18%,transparent)}
.dropb:hover{background:color-mix(in oklab,var(--drop) 24%,var(--panel))}
.dropb:active{transform:scale(.98)}
.brkb{background:color-mix(in oklab,var(--break) 14%,var(--panel));color:var(--break)}
.brkb kbd{background:color-mix(in oklab,var(--break) 18%,transparent)}
.brkb:hover{background:color-mix(in oklab,var(--break) 24%,var(--panel))}
.brkb:active{transform:scale(.98)}
.hist{display:grid;gap:6px;margin-left:4px}
.hd{display:flex;gap:5px;align-items:center;min-height:18px}
.hdot{--mc:var(--classic);width:18px;height:18px;border-radius:5px;border:0;padding:0;background:color-mix(in oklab,var(--mc) 30%,var(--panel))}
.hdot[data-m="surprise"]{--mc:var(--surprise)} .hdot[data-m="drop"]{--mc:var(--drop)} .hdot[data-m="break"]{--mc:var(--break)}
.hdot:hover{background:color-mix(in oklab,var(--mc) 65%,var(--panel))}
.hdot[aria-pressed="true"]{background:var(--mc);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--mc)}
.midi{margin-left:auto;height:50px;display:flex;align-items:center;gap:11px;padding:0 14px 0 10px;border-radius:10px;border:0;background:var(--panel);cursor:grab;text-align:left}
.midi:hover{background:var(--tile)}
.midi.ok{box-shadow:inset 0 0 0 1.5px var(--classic)}
.file{width:28px;height:34px;border-radius:4px 9px 4px 4px;background:var(--tile-hi);display:grid;place-items:center;font:700 8.5px var(--mono);color:var(--hit);letter-spacing:.04em}
.midi b{display:block;font-size:12.5px;font-weight:700}
.midi small{display:block;color:var(--faint);font-size:10.5px;margin-top:1px;font-weight:500}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,8px);max-width:80%;background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:99px;font-weight:700;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--drop);color:#101012}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-mode="classic">
<div class="win">
  <header class="top">
    <div class="logo"><span class="mark"><svg viewBox="0 0 16 16"><path d="M2 12.5 6 4l3 6 2-3 3 5.5"/></svg></span>KICKSTART</div>
    <button class="beatbar" id="beatbar" title="Choisir le style et le kit"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3"/><circle cx="5.7" cy="5.7" r=".6" fill="currentColor"/><circle cx="10.3" cy="10.3" r=".6" fill="currentColor"/><circle cx="8" cy="8" r=".6" fill="currentColor"/></svg><b id="desc"></b><span class="sd" id="seed"></span></button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="seq" aria-selected="true">Pattern</button>
      <button class="tab" role="tab" data-tab="style" aria-selected="false">Style &amp; kit</button>
    </div>
    <div class="sq">
      <div class="readout" id="tp" title="Tempo de Live"><span class="tdot"></span><b id="bpm">—</b>bpm</div>
      <button class="ib" id="play" aria-pressed="false" title="Lecture (hors de Live)" aria-label="Lecture" hidden>
        <svg class="off" viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 3v10l8-5z"/></svg><svg class="on" viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3.5" width="3" height="9" rx=".6"/><rect x="9" y="3.5" width="3" height="9" rx=".6"/></svg>
      </button>
      <button class="ib" id="listen" aria-pressed="true" title="Écouter le pattern dans le Drum Rack pendant la lecture de Live" aria-label="Écoute">
        <svg class="on" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z"/><path d="M11 6.5c.7.8.7 2.2 0 3M12.8 4.8c1.6 1.8 1.6 4.6 0 6.4"/></svg>
        <svg class="off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z"/><path d="M11 6l4 4M15 6l-4 4"/></svg>
      </button>
    </div>
  </header>

  <div class="mid"><section class="seq" aria-label="Panneau principal">
    <div class="view" id="vSeq">
      <div class="panel"><div class="rackv">
        <div class="rackh"><span class="lab">Rack</span><div class="segc" id="banks" role="radiogroup" aria-label="Banque de pads"></div><span class="lab">Glisse un instrument sur un pad, ou clique ⌄ pour le choisir</span><div class="fld" id="fRack"><span class="lab">Preset</span><button class="vb sel" id="rackBtn" aria-haspopup="listbox" aria-expanded="false"><span id="rackTxt"></span><svg viewBox="0 0 10 10"><path d="M2 3.5 5 6.5l3-3"/></svg></button><div class="menu" id="rackMenu" role="listbox" hidden></div></div><button class="tog" id="swClip" role="switch" aria-checked="true" title="Coupé : grille droite, à swinguer avec un Groove de Live"><i></i>Swing écrit dans le clip</button></div>
        <div class="pgrid" id="pgrid"></div>
      </div></div>
      <div class="panel"><div class="seqv">
        <div class="strip">
          <div class="fld"><span class="lab">Type</span><div class="segc" id="types" role="radiogroup" aria-label="Type"></div></div>
          <div class="fld"><span class="lab">Longueur</span>
            <button class="vb sel" id="lenBtn" aria-haspopup="listbox" aria-expanded="false"><span id="lenTxt"></span><svg viewBox="0 0 10 10"><path d="M2 3.5 5 6.5l3-3"/></svg></button>
            <div class="menu" id="lenMenu" role="listbox" hidden></div>
          </div>
          <div id="fSwing"></div><div id="fDens"></div><div id="fDyn"></div>
          <button class="kitlink" id="kitLink" title="Changer de kit">Kit · <b id="kitName"></b> ▾</button>
        </div>
        <div class="derive" id="derive" hidden><span class="tag" id="dtag"></span><button class="link" id="orig">revenir à l'original</button></div>
        <div class="ruler" id="ruler"></div><div class="rows grid" id="grid"></div>
      </div></div>
    </div>

    <div class="view panel" id="vStyle" hidden><div class="pane">
      <div class="sec"><span class="lab">Style · un clic génère un nouveau beat</span><div class="pads" id="styles" role="radiogroup" aria-label="Style"></div></div>
      <div class="sec"><span class="lab">Kit</span><div class="chips" id="presets"></div></div>
      <div class="kg" id="kgrid"></div>
    </div></div>
  </section></div>

  <footer class="act">
    <button class="gen" id="gen" title="Nouveau pattern (G)">Générer <kbd>G</kbd></button>
    <button class="dropb" id="drop" title="Garde la structure et la pousse en drop (D)">Tenter un drop <kbd>D</kbd></button>
    <button class="brkb" id="brk" title="Garde la structure et la dépouille en breakdown (B)">Breakdown <kbd>B</kbd></button>
    <div class="hist"><span class="lab">Derniers beats</span><div class="hd" id="hdots"></div></div>
    <button class="ib" id="back" aria-label="Annuler" title="Annuler (Z)" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 5 3.5 9l4 4"/><path d="M3.5 9h8a5 5 0 0 1 0 10H9"/></svg></button>
    <button class="midi" id="midi" title="Maintiens et glisse vers une piste ou un slot de Live. Double-clic ou E : exporter un .mid"><span class="file">MIDI</span><span><b>Glisser le MIDI</b><small>vers Live · double-clic : exporter</small></span></button>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>

/* Pistes affichables, dans l'ordre du séquenceur */
/* 22 instruments, groupés (g) et colorés (c). Les groupes se suivent : l'ordre de la liste est l'ordre du séquenceur */
const TRACKS=[
  {id:'k',name:'Kick',g:0,c:'#ff5d73'},{id:'sn',name:'Snare',g:0,c:'#44c2f7'},{id:'cp',name:'Clap',g:0,c:'#7b93ff'},
  {id:'snap',name:'Snap',g:0,c:'#8ad0ff'},{id:'rim',name:'Rim',g:0,c:'#b48cff'},{id:'rs',name:'Rimshot',g:0,c:'#8f7bff'},
  {id:'ch',name:'Hat fermé',g:1,c:'#e8d44d'},{id:'hp',name:'Hat pédale',g:1,c:'#d9c84a'},{id:'oh',name:'Hat ouvert',g:1,c:'#f2a93b'},
  {id:'ride',name:'Ride',g:1,c:'#3fd6b0'},{id:'cr',name:'Crash',g:1,c:'#ffe9a8'},{id:'cb',name:'Cowbell',g:1,c:'#ff8a4c'},
  {id:'shk',name:'Shaker',g:2,c:'#93d95a'},{id:'tamb',name:'Tambourin',g:2,c:'#c9e04f'},
  {id:'clv',name:'Clave',g:3,c:'#b9e07a'},{id:'wb',name:'Woodblock',g:3,c:'#8fc98a'},
  {id:'pl',name:'Conga grave',g:4,c:'#ff7ab8'},{id:'pm',name:'Conga médium',g:4,c:'#f08fd0'},{id:'ph',name:'Conga aiguë',g:4,c:'#e0a0f0'},
  {id:'th',name:'Tom aigu',g:4,c:'#e9c48a'},{id:'tm',name:'Tom médium',g:4,c:'#d9a06a'},{id:'tl',name:'Tom grave',g:4,c:'#c47f58'}];
const GROUPS=['Fondations','Métaux','Secoués','Bois','Peaux'];
const IDS=TRACKS.map(t=>t.id);
const NAME=Object.fromEntries(TRACKS.map(t=>[t.id,t.name]));
/* Si une piste du pattern n'est pas dans le kit, son rôle passe à la première piste dispo de la liste.
   Crash, snap, clave et woodblock n'ont pas de remplaçant : sans eux, ils ne jouent pas. */
const FALLBACK={k:['k'],sn:['sn','cp','rim'],cp:['cp','sn','rim'],snap:['snap'],rim:['rim'],rs:['rs','rim'],
  ch:['ch','hp','shk','tamb'],hp:['hp','ch'],oh:['oh','ride'],ride:['ride'],cr:['cr'],cb:['cb'],shk:['shk'],tamb:['tamb'],
  clv:['clv'],wb:['wb'],pl:['pl'],pm:['pm','ph','pl'],ph:['ph'],th:['th','tm','tl'],tm:['tm','th','tl'],tl:['tl','tm','th']};
const PRESETS={
  'Essentiel':['k','sn','cp','ch','oh','rim'],
  'Groove house':['k','cp','snap','ch','oh','shk','rim','pm','ph'],
  'Latin':['k','cp','ch','cb','shk','pl','pm','ph','tamb','clv','wb'],
  'Dub':['k','sn','rim','rs','ch','hp','oh','ride','pm','tl'],
  'Breaks':['k','sn','ch','oh','ride','rim','th','tm','tl'],
  'Tout':IDS};
/* Par style : tempo, swing, delay dub, kick (durée, attaque), et la colonne vertébrale utilisée par « Tenter un drop » */
const GENRE_DEF={
  house:    {bpm:124,swing:54,wet:0, dub:0,kick:[.42,165],dk:[0,4,8,12],back:[4,12],doh:[2,6,10,14],desc:"House : kick sur chaque temps, clap sur 2 et 4, hats ouverts sur les contretemps."},

const copyPat=p=>Object.fromEntries(Object.entries(p).map(([k,v])=>[k,v.slice()]));
function snapshot(){return{pat:copyPat(S.pat),sig:{...S.sig},seed:S.seed,beats:S.beats,genre:S.genre,mode:S.mode,kit:new Set(S.kit),
  base:S.base&&copyPat(S.base),baseMode:S.baseMode,dropName:S.dropName,dropN:S.dropN,dropFlavor:S.dropFlavor,dropSeed:S.dropSeed,derived:S.derived}}
function pushHist(){if(Object.keys(S.pat).length){S.hist.push(snapshot());if(S.hist.length>30)S.hist.shift()}}
const steps=()=>S.beats*4;
const active=()=>IDS.filter(id=>S.kit.has(id));

/* ---------- génération ---------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const E=()=>Object.fromEntries(IDS.map(id=>[id,Array(16).fill(0)]));
const set=(b,id,arr,v)=>arr.forEach(s=>b[id][s]=v);
const euclid=(k,n,rot=0)=>Array.from({length:n},(_,i)=>(((i+rot)*k)%n)<k);
const clone=b=>Object.fromEntries(IDS.map(id=>[id,b[id].slice()]));
const each=(e,fn)=>{for(let s=0;s<16;s++)if(e[s%e.length])fn(s)};

/* Éléments additionnels : ride, cowbell, shaker, tambourin, congas grave/aiguë, toms, puis snap, rimshot, hat pédale, clave, woodblock */
const CONGA_LH=["......h.......h.","...h...l...h..l.","..h.h.....h.l...",".h....l..h....l.","..h...h...h.l.h."];
function extras(b,c){
  const G=S.genre,M=S.mode,dub=GENRE_DEF[G].dub;
  // ride
  if(M==='classic'){if(!dub)set(b,'ride',c.pick([[2,6,10,14],[0,4,8,12]]),.45);
    else for(let s=0;s<16;s+=2)b.ride[s]=s%4===2?.5:.32}
  else if(M==='surprise'){const e=euclid(5,8,c.int(8));for(let i=0;i<8;i++)if(e[i])b.ride[i*2]=.45;if(c.maybe(.5))b.ride[c.pick([3,11,15])]=.35}
  else for(let s=0;s<16;s+=2)b.ride[s]=s%4===2?.6:.45;
  // cowbell
  if(M==='classic')set(b,'cb',c.pick(dub?[[3,10],[6,14],[10]]:[[2,10],[6,14],[3,10],[7,14]]),.5);
  else if(M==='surprise'){each(euclid(3,8,c.int(8)),s=>b.cb[s]=s<8?.55:.42);if(c.maybe(.4))b.cb[c.pick([5,13])]=.35}
  else{if(c.r()<.5)set(b,'cb',[2,6,10,14],.55);else each(euclid(5,16,c.int(16)),s=>b.cb[s]=.5)}
  // shaker
  if(M==='classic'){for(let s=0;s<16;s++)if(c.maybe(.9))b.shk[s]=s%2?.38:.22}
  else if(M==='surprise')each(euclid(11,16,c.int(16)),s=>b.shk[s]=s%4===2?.45:.28);
  else for(let s=0;s<16;s++)b.shk[s]=s%2?.5:.3;
  // tambourin
  if(M==='classic'){if(c.r()<.5)set(b,'tamb',GENRE_DEF[G].back,.5);else set(b,'tamb',[2,6,10,14],.42)}
  else if(M==='surprise')each(euclid(3,8,c.int(8)),s=>b.tamb[s]=.45);
  else{set(b,'tamb',[2,6,10,14],.55);set(b,'tamb',[3,11],.32)}
  // congas grave et aiguë (la médium vient de la recette)
  if(M==='classic'){[...c.pick(CONGA_LH)].forEach((ch,s)=>{if(ch!=='.'&&c.maybe(.9))b[ch==='l'?'pl':'ph'][s]=ch==='l'?.6:.55})}
  else if(M==='surprise'){each(euclid(5,16,c.int(16)),s=>{b[c.r()<.4?'pl':'ph'][s]=.55});if(c.maybe(.5))b.ph[c.pick([7,15])]=.35}
  else each(euclid(7,16,c.int(16)),s=>{b[s%4===0?'pl':'ph'][s]=s%4===0?.65:.55});
  // toms : peu dans le groove, surtout dans les fills
  if(M==='surprise'&&c.maybe(.35))b[c.pick(['th','tm','tl'])][c.pick([7,14])]=.5;
  if(dub&&M==='classic'&&c.maybe(.25))b.tl[15]=.45;
  // les derniers venus sont tirés après les autres : les motifs précédents ne changent pas. Le crash est posé dans build().
  const afro=G==='afro',loose=G==='dub'||G==='dubstep'||G==='breaks',back=GENRE_DEF[G].back;
  // snap : double le clap en house, afro et garage
  if(G==='house'||afro||G==='garage'){
    if(M==='classic'){if(c.maybe(.45))set(b,'snap',back,.55)}
    else if(M==='surprise'){if(c.maybe(.5))b.snap[c.pick([7,15])]=.5}
    else set(b,'snap',back,.7)}
  else if(c.maybe(.1))b.snap[c.pick(back)]=.4;
  // rimshot : surtout dans les styles à delay
  if(dub){
    if(M==='classic'){if(c.maybe(.5))set(b,'rs',c.pick([[14],[6,14],[11]]),.5)}
    else if(M==='surprise')each(euclid(3,8,c.int(8)),s=>b.rs[s]=.5);
    else set(b,'rs',[4,12],.55)}
  else if(c.maybe(.15))b.rs[c.pick([7,15])]=.4;
  // hat pédale : petits coups entre les hats en dub, dubstep et breakbeat
  if(loose){
    if(M==='classic'){for(let s=1;s<16;s+=2)if(c.maybe(.4))b.hp[s]=.3}
    else if(M==='surprise')each(euclid(5,16,c.int(16)),s=>b.hp[s]=.32);
    else for(let s=1;s<16;s+=2)b.hp[s]=.35}
  else if(c.maybe(.15))b.hp[c.pick([7,15])]=.3;
  // clave (3-2 ou rumba) et woodblock : l'afro house
  if(afro)set(b,'clv',M==='surprise'?[0,3,7,10,12]:[0,3,6,10,12],M==='drop'?.7:.6);
  else if(M==='surprise'&&c.maybe(.2))each(euclid(5,16,c.int(16)),s=>b.clv[s]=.4);
  if(afro){if(c.maybe(.6))set(b,'wb',c.pick([[2,5,9,14],[5,9,13],[2,10]]),.45)}
  else if(c.maybe(.1))b.wb[c.pick([5,13])]=.4;
  return b}

function mutate(b,c){const n=1+c.int(2);
  for(let i=0;i<n;i++){const op=c.int(5);
    if(op===0){const s=1+2*c.int(8);if(!b.oh[s])b.ch[s]=b.ch[s]?0:.3}
    else if(op===1){const hits=b.rim.map((v,s)=>v?s:-1).filter(s=>s>0);
      if(hits.length){const s=c.pick(hits),t=(s+c.pick([1,2,-1,-2])+16)%16;if(t&&!b.rim[t]){b.rim[t]=b.rim[s];b.rim[s]=0}}else b.rim[c.pick([3,7,11])]=.55}
    else if(op===2)b.pm[1+2*c.int(8)]=.42;
    else if(op===3){const s=1+2*c.int(8);b.ph[s]=b.ph[s]?0:.4;b.cb[c.pick([7,15])]=b.cb[c.pick([7,15])]||.35}
    else if(c.maybe(.6))b.k[15]=.55}
  return b}

/* Roulement de toms qui descend : aigu, médium, grave, répartis sur les pas donnés */
function tomRoll(b,ss,v){const T=['th','tm','tl'];ss.forEach((s,i)=>{const id=T[Math.min(2,Math.floor(i*3/ss.length))];b[id][s]=Math.max(b[id][s],v)})}
function fill(b,c){
  if(S.mode==='classic'){c.pick([[13,15],[14,15],[12,14,15]]).forEach((s,i)=>b.sn[s]=.45+i*.12);if(c.maybe(.5))b.oh[14]=0;
    if(c.maybe(.5))set(b,'ph',[13,14,15],.5);if(c.maybe(.4))tomRoll(b,[14,15],.6)}
  else if(S.mode==='surprise'){const e=euclid(5,8,c.int(8));
    for(let s=8;s<16;s++)if(e[s-8])b[c.pick(['pm','sn','ph'])][s]=.5+.05*(s-8);
    tomRoll(b,c.pick([[13,14,15],[12,14,15],[14,15]]),.65);
    if(c.maybe(.5)){b.k[12]=0;b.k[14]=.7}}
  else{for(let s=0;s<8;s+=2)b.sn[s]=Math.max(b.sn[s],.28+s*.03);
    for(let s=8;s<16;s++)b.sn[s]=.45+(s-8)*.075;
    tomRoll(b,[13,14,15],.8);
    if(c.maybe(.6))b.k[12]=0;b.oh[14]=0;b.ride[14]=0}
  return b}

/* Dynamique : accents sur les temps forts et variations de vélocité propres à chaque instrument.
   DYN[id] = [force de l'accent métrique, variation aléatoire]. Les hats, ride et shaker bougent beaucoup, le kick à peine.
   Le tirage a sa propre seed : les motifs ne changent pas, seulement leurs vélocités. */
const DYN={k:[.25,.06],sn:[.2,.1],cp:[.2,.1],snap:[.2,.1],rim:[.4,.15],rs:[.4,.12],ch:[1,.22],hp:[.8,.2],oh:[.5,.14],ride:[1,.18],cr:[0,.05],cb:[.4,.15],
  shk:[1,.28],tamb:[.8,.22],clv:[.3,.12],wb:[.3,.12],pl:[.3,.22],pm:[.3,.22],ph:[.3,.22],th:[.2,.14],tm:[.2,.14],tl:[.2,.14]};
function humanize(bars,r,amt){
  if(amt<=0)return;
  bars.forEach(bar=>IDS.forEach(id=>{const v=bar[id],[acc,rnd]=DYN[id];
    for(let s=0;s<16;s++){const x=v[s];if(!x)continue;
      const pos=s%4===0?1:s%4===2?.35:-.6;      // temps fort, contretemps, double-croche impaire
      const ghost=x<.35?.5:1;                    // les notes fantômes varient moins
      const d=(amt*acc*pos*.3+(r()-.5)*2*amt*rnd)*ghost;
      v[s]=Math.min(1,Math.max(.12,x*(1+d)))}}))}

/* Construit le pattern brut (toujours toutes les pistes, même tirage) puis le projette sur le kit choisi */
function build(newSeed){
  if(newSeed){pushHist();S.seed=Math.floor(Math.random()*99999)}
  S.base=null;S.dropN=0;S.derived='';
  const r=mulberry(S.seed),f=S.dens*1.6;
  const c={r,maybe:p=>r()<Math.min(1,p*f),int:n=>Math.floor(r()*n),pick:a=>a[Math.floor(r()*a.length)]};
  const A=extras(R[S.genre][S.mode](c),c),B=mutate(clone(A),c),nb=S.beats/4;
  const order={1:[A],2:[A,B],3:[A,A,B],4:[A,B,A,B]}[nb].map(clone);
  if(nb>1)fill(order[nb-1],c);
  if(c.maybe(.5)||S.mode==='drop')order[0].cr[0]=.85; // crash sur le premier temps de la boucle
  humanize(order,mulberry(S.seed*131+17),S.dyn);
  const raw=Object.fromEntries(IDS.map(id=>[id,order.flatMap(bar=>bar[id])]));
  // projection sur le kit
  const pat={},sig={},n=steps();
  active().forEach(id=>{pat[id]=Array(n).fill(0);sig[id]=[]});
  IDS.forEach(src=>{const dest=FALLBACK[src].find(t=>S.kit.has(t));if(!dest)return;
    sig[dest].push(src);raw[src].forEach((v,i)=>{if(v>pat[dest][i])pat[dest][i]=v})});
  Object.keys(sig).forEach(id=>sig[id]=sig[id].join('+'));
  // garder les pistes verrouillées, et (si on change seulement le kit) les pistes inchangées avec tes retouches
  active().forEach(id=>{const old=S.pat[id];if(!old)return;
    if(S.locks.has(id))pat[id]=Array.from({length:n},(_,i)=>old[i%old.length]);
    else if(!newSeed&&S.sig[id]===sig[id]&&old.length===n)pat[id]=old});
  S.pat=pat;S.sig=sig;render();
}
let generate=()=>{S.curId=null;build(true);record()};

/* ---------- transformer le pattern actuel en drop ---------- */
const DROPS=[
  {name:'Plein régime',txt:'tout le kit joue, backbeat doublé, roulement de snare en fin de boucle'},
  {name:'Rebond',txt:'kicks de relance, contretemps de percs, descente de toms en fin de boucle'},
  {name:'Montée',txt:'la dernière mesure monte en roulement et le kick respire avant de retomber sur le 1'}];
const MODE_LABEL={classic:'classique',surprise:'surprenant',drop:'drop'};
function tryDrop(){S.curId=null;
  let f;do{f=Math.floor(Math.random()*DROPS.length)}while(f===S.lastFlavor&&DROPS.length>1);
  S.lastFlavor=f;applyDrop(f,Math.floor(Math.random()*99999),(S.base&&S.derived==='drop'?S.dropN:0)+1,true);record()}
function applyDrop(flavor,seed,n,push){
  if(push)pushHist();
  if(!S.base){S.base=copyPat(S.pat);S.baseMode=S.mode}
  const p=copyPat(S.base),r=mulberry(seed),maybe=x=>r()<x,pick=a=>a[Math.floor(r()*a.length)];
  const N=steps(),nb=Math.max(1,N/16),last=(nb-1)*16;
  const has=id=>!!p[id];
  const put=(id,s,v)=>{if(has(id))p[id][s]=Math.max(p[id][s],Math.min(1,v))};
  const cut=(id,s)=>{if(has(id))p[id][s]=0};
  const first=ids=>ids.find(has);
  // tout le monde un peu plus fort
  for(const id in p)p[id]=p[id].map(v=>v?Math.min(1,v*1.12+.03):0);
  // la colonne vertébrale du drop, posée par-dessus ta structure
  const back=first(['cp','sn','rim']),GD=GENRE_DEF[S.genre];
  for(let s=0;s<N;s++){const b=s%16,q=s%4;
    if(GD.dk.includes(b))put('k',s,1);
    if(GD.back.includes(b)){put(back,s,.95);if(has('cp')&&has('sn'))put('sn',s,.75)}
    if(GD.doh.includes(b)){if(has('oh')){put('oh',s,.85);cut('ch',s)}else{put('ride',s,.7);put('ch',s,.8)}}
    else if(has('ch')&&!p.ch[s]&&maybe(.65))put('ch',s,s%2?.36:.5);
    if(has('shk')&&p.shk.some(v=>v))put('shk',s,s%2?.5:.3)}
  // tes percs gardent leur motif, et le reprennent en écho une demi-mesure plus loin
  ['rim','cb','pl','pm','ph','tamb','ride'].filter(has).forEach(id=>{
    const src=p[id].slice();
    for(let s=0;s<N;s++)if(src[s]&&maybe(.45)){const t=s-s%16+((s%16)+8)%16;if(!p[id][t])p[id][t]=src[s]*.8}});
  // couleur propre à chaque drop
  const roll=(from,to,step)=>{const id=first(['sn','cp','rim']);const span=to-from;
    for(let s=from;s<to;s+=step)put(id,s,.35+.65*((s-from)/span))};
  if(flavor===0){
    for(let s=0;s<N;s++)if(s%4===2)put('tamb',s,.55);
    for(let s=0;s<N;s+=2)put('ride',s,s%4===2?.6:.42);
    nb>1?(roll(last+8,last+12,2),roll(last+12,last+16,1)):roll(12,16,1);
  }else if(flavor===1){
    const perc=first(['ph','pm','cb','pl','rim']);
    for(let bar=0;bar<nb;bar++){const o=bar*16;
      put('k',o+15,.6);if(maybe(.5))put('k',o+pick([7,10]),.7);
      for(let q=3;q<16;q+=4){if(maybe(.5))put(perc,o+q,.45);if(maybe(.4))put('ch',o+q,.55)}}
    const TM=['th','tm','tl'].filter(has);
    if(TM.length)[13,14,15].forEach((s,i)=>put(TM[Math.min(TM.length-1,Math.floor(i*TM.length/3))],last+s,.7+i*.1));
    else{const tomId=first(['pl','pm','sn']);[13,14,15].forEach((s,i)=>put(tomId,last+s,.7+i*.1))}
  }else{
    if(nb>1){roll(last,last+8,2);roll(last+8,last+16,1);
      for(let s=last+8;s<last+16;s++)cut('k',s);cut('oh',last+14);cut('ride',last+14)}
    else roll(12,16,1);
    put(first(['ride','oh','cb']),0,1);
  }
  put('cr',0,.95); // un drop démarre sur un crash
  // les pistes verrouillées ne bougent pas
  S.locks.forEach(id=>{if(S.base[id])p[id]=S.base[id].slice()});
  S.pat=p;S.derived='drop';S.dropFlavor=flavor;S.dropSeed=seed;S.dropN=n;S.dropName=DROPS[flavor].name;
  render();
}

/* ---------- breakdown : l'inverse du drop, à partir du pattern de base ---------- */
const BREAKS=[
  {name:'Dépouillé',txt:'kick et backbeat retirés, hats et percs restent, roulement avant le retour'},
  {name:'Percussif',txt:'plus de kick ni de hats : les percs passent devant, descente de toms à la fin'},
  {name:'Respiration',txt:'un kick doux par mesure, hats clairsemés, le kick revient sur la dernière mesure avec un roulement'}];
const DERIVED_NAME={drop:'Drop',break:'Breakdown'};
const DER=()=>S.derived==='break'?BREAKS:DROPS;
function tryBreak(){S.curId=null;
  let f;do{f=Math.floor(Math.random()*BREAKS.length)}while(f===S.lastBrkFlavor&&BREAKS.length>1);
  S.lastBrkFlavor=f;applyBreak(f,Math.floor(Math.random()*99999),(S.base&&S.derived==='break'?S.dropN:0)+1,true);record()}
function applyBreak(flavor,seed,n,push){
  if(push)pushHist();
  if(!S.base){S.base=copyPat(S.pat);S.baseMode=S.mode}
  const p=copyPat(S.base),r=mulberry(seed),maybe=x=>r()<x;
  const N=steps(),nb=Math.max(1,N/16),last=nb>1?(nb-1)*16:0;
  const has=id=>!!p[id];
  const put=(id,s,v)=>{if(has(id))p[id][s]=Math.max(p[id][s],Math.min(1,v))};
  const clear=ids=>ids.forEach(id=>{if(has(id))p[id]=p[id].map(()=>0)});
  const scale=(ids,k)=>ids.forEach(id=>{if(has(id))p[id]=p[id].map(v=>v?Math.min(1,Math.max(.12,v*k)):0)});
  const first=ids=>ids.find(has);
  const PERC=['rim','rs','cb','clv','wb','pl','pm','ph','tamb','shk'];
  if(flavor===1&&!PERC.some(has))flavor=0; // pas de percs dans le kit : on retombe sur le dépouillé
  // montée de caisse claire : crescendo entre deux pas
  const roll=(from,to,step,top)=>{const id=first(['sn','cp','rim','rs']);if(!id)return;
    for(let s=from;s<to;s+=step)put(id,s,.3+(top-.3)*((s-from)/(to-from)))};
  clear(['k','sn','cp','snap']); // dans tous les breakdowns : plus de grave ni de backbeat
  if(flavor===0){
    scale(['ch','hp','oh','ride'],.8);
    roll(last+8,last+16,2,.85);
  }else if(flavor===1){
    clear(['ch','hp','oh']);scale(PERC,1.15);
    PERC.filter(has).forEach(id=>{const src=p[id].slice();
      for(let s=0;s<N;s++)if(src[s]&&maybe(.5)){const t=s-s%16+((s%16)+8)%16;if(!p[id][t])p[id][t]=src[s]*.8}});
    const TM=['th','tm','tl'].filter(has);
    if(TM.length)[13,14,15].forEach((s,i)=>put(TM[Math.min(TM.length-1,Math.floor(i*TM.length/3))],last+s,.7+i*.1));
  }else{
    ['ch','hp'].forEach(id=>{if(has(id))for(let s=1;s<N;s+=2)p[id][s]=0});
    for(let bar=0;bar<nb-1;bar++)put('k',bar*16,.7);
    if(nb===1)put('k',0,.7);
    put('k',last+12,.9);
    roll(last+8,last+16,2,.85);
  }
  put('cr',0,.9);
  S.locks.forEach(id=>{if(S.base[id])p[id]=S.base[id].slice()});
  S.pat=p;S.derived='break';S.dropFlavor=flavor;S.dropSeed=seed;S.dropN=n;S.dropName=BREAKS[flavor].name;
  render();
}
function backToOriginal(){if(!S.base)return;S.curId=null;pushHist();S.pat=S.base;S.base=null;S.dropN=0;S.derived='';render()}
function rebuildKit(){
  const was=S.base?{kind:S.derived,f:S.dropFlavor,seed:S.dropSeed,n:S.dropN}:null;
  if(was)S.pat=S.base;
  build(false);
  if(was)(was.kind==='break'?applyBreak:applyDrop)(was.f,was.seed,was.n,false)}
/* ---------- audio ---------- */
let ac,master,noiseBuf,send,dly,ohGain=null;
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;
  master=ac.createGain();master.gain.value=.7;master.connect(comp).connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  send=ac.createGain();dly=ac.createDelay(2);const fb=ac.createGain(),lp=ac.createBiquadFilter();
  fb.gain.value=.45;lp.type='lowpass';lp.frequency.value=2400;
  send.connect(dly);dly.connect(lp).connect(fb).connect(dly);lp.connect(master);updDelay();
}
function updDelay(){if(dly)dly.delayTime.value=Math.min(1.9,60/S.bpm/4*3)}
function env(g,t,p,dec,att=.002){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,p),t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dec)}

function filt(type,f,q=.7){const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b}
function out(node,wet){node.connect(master);if(wet&&GENRE_DEF[S.genre].wet){const g=ac.createGain();g.gain.value=wet*GENRE_DEF[S.genre].wet;node.connect(g).connect(send)}}
function osc(t,dur,type,f0,f1,dest){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur*.6);o.connect(dest);o.start(t);o.stop(t+dur+.05);return o}
function conga(t,v,f,dec,slap){const g=ac.createGain();env(g,t,v*.75,dec);osc(t,dec,'sine',f*1.25,f,g);
  if(slap){const g2=ac.createGain();env(g2,t,v*.25,.03);nz(t,.04).connect(filt('bandpass',3500,1)).connect(g2);out(g2)}out(g,.3)}
const V={
  k(t,v){const g=ac.createGain(),[L,f0]=GENRE_DEF[S.genre].kick;env(g,t,v*1.1,L);
    const o=ac.createOscillator();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(46,t+.1);o.connect(g);out(g);o.start(t);o.stop(t+L+.05)},
  sn(t,v){const g=ac.createGain();env(g,t,v*.6,.18);nz(t,.2).connect(filt('bandpass',1900,.8)).connect(g);
    const g2=ac.createGain();env(g2,t,v*.45,.1);osc(t,.12,'triangle',200,160,g2);out(g,.3);out(g2)},
  cp(t,v){const g=ac.createGain();g.gain.setValueAtTime(.0001,t);
    for(let i=0;i<3;i++){const tt=t+i*.011;g.gain.setValueAtTime(v*.9,tt);g.gain.exponentialRampToValueAtTime(v*.12,tt+.009)}
    g.gain.setValueAtTime(v*.8,t+.033);g.gain.exponentialRampToValueAtTime(.0001,t+.24);
    nz(t,.26).connect(filt('bandpass',1150,1.2)).connect(g);out(g,.25)},
  rim(t,v){const g=ac.createGain(),bp=filt('bandpass',1700,3);env(g,t,v*.7,.05);
    osc(t,.06,'triangle',1750,0,bp);osc(t,.06,'square',480,0,bp);bp.connect(g);out(g,.45)},
  ch(t,v){if(ohGain){ohGain.gain.cancelScheduledValues(t);ohGain.gain.setTargetAtTime(.0001,t,.008);ohGain=null}
    const g=ac.createGain();env(g,t,v*.42,.045);nz(t,.06).connect(filt('highpass',7500)).connect(g);out(g)},
  oh(t,v){const g=ac.createGain();env(g,t,v*.38,.32);nz(t,.35).connect(filt('highpass',7000)).connect(g);out(g);ohGain=g},
  ride(t,v){const g=ac.createGain(),hp=filt('highpass',5200);env(g,t,v*.16,.55);
    [1,1.34,1.71,2.29].forEach(r=>osc(t,.6,'square',420*r,0,hp));
    const g2=ac.createGain();env(g2,t,v*.12,.4);nz(t,.45).connect(filt('bandpass',9000,.9)).connect(g2);hp.connect(g);out(g);out(g2)},
  cb(t,v){const g=ac.createGain(),bp=filt('bandpass',800,2.2);env(g,t,v*.55,.22);
    osc(t,.25,'square',545,0,bp);osc(t,.25,'square',815,0,bp);bp.connect(g);out(g,.35)},
  shk(t,v){const g=ac.createGain();env(g,t,v*.32,.07,.012);nz(t,.09).connect(filt('bandpass',6200,.9)).connect(g);out(g)},
  tamb(t,v){const g=ac.createGain();env(g,t,v*.3,.16,.004);nz(t,.18).connect(filt('highpass',8200)).connect(g);
    const g2=ac.createGain(),bp=filt('bandpass',7000,6);env(g2,t,v*.12,.12);osc(t,.14,'square',6800,0,bp);bp.connect(g2);out(g);out(g2)},
  pl(t,v){conga(t,v,175,.32,false)},
  pm(t,v){conga(t,v,255,.24,false)},
  ph(t,v){conga(t,v,345,.17,true)},

/* Boîte de valeur : glisser, molette, flèches ; double-clic remet la valeur par défaut ; « commit » au relâchement */
function vbox(host,label,{min,max,get,set,fmt,reset,tip,commit}){
  const f=document.createElement('div');f.className='fld';
  f.innerHTML=`<span class="lab">${label}</span><div class="vb" tabindex="0" role="slider" aria-label="${label}" title="${tip}"><span class="pv"></span><i class="pbar"></i></div>`;
  const el=f.querySelector('.vb'),pv=f.querySelector('.pv'),bar=f.querySelector('.pbar');
  el.setAttribute('aria-valuemin',min);el.setAttribute('aria-valuemax',max);
  const show=()=>{const v=get();pv.textContent=fmt(v);bar.style.width=((v-min)/(max-min)*100)+'%';el.setAttribute('aria-valuenow',v)};
  const apply=v=>{v=Math.round(Math.min(max,Math.max(min,v)));if(v!==get()){set(v);show()}};
  let drag=null,committed=get(),t;
  const done=()=>{if(get()!==committed){committed=get();commit()}};
  const later=()=>{clearTimeout(t);t=setTimeout(done,380)};
  el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,b:get()};committed=get();el.setPointerCapture(e.pointerId);el.classList.add('drag');e.preventDefault()});

  const end=()=>{if(!drag)return;drag=null;el.classList.remove('drag');done()};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{e.preventDefault();apply(get()+(e.deltaY<0?1:-1)*(e.shiftKey?5:1));later()},{passive:false});
  el.addEventListener('keydown',e=>{const k={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1}[e.key];if(!k)return;e.preventDefault();e.stopPropagation();apply(get()+k*(e.shiftKey?10:1));later()});
  el.addEventListener('dblclick',()=>{apply(reset());later()});
  f.show=show;show();host.replaceWith(f);return f}

$('rackBtn').onclick=e=>{e.stopPropagation();const open=$('rackMenu').hidden;closePick();closeLen();
  if(open){const m=$('rackMenu');m.innerHTML='';const cur=rackPresetName();
    RACK_PRESETS.forEach(p=>{const b=document.createElement('button');b.className='mi';b.setAttribute('role','option');b.setAttribute('aria-checked',p.name===cur);b.title=p.desc;
      b.innerHTML=`${p.name}<small>${p.silent.length?p.silent.length+' sans sample':'tous les sons'}</small>`;b.onclick=ev=>{ev.stopPropagation();closeRack();applyRack(p)};m.appendChild(b)});
    m.hidden=false}else closeRack();
  $('rackBtn').setAttribute('aria-expanded',open)};
$('swClip').onclick=()=>{S.swingClip=!S.swingClip;store.set('swingClip',S.swingClip);$('swClip').setAttribute('aria-checked',S.swingClip);pushPattern()};

/* ---------- séquenceur ---------- */
let cols=[],fresh=false;
const grid=$('grid');
const BAR_LETTERS={1:'A',2:'AB',3:'AAB',4:'ABAB'};
function render(){
  const n=steps(),list=TRACKS.filter(t=>S.kit.has(t.id)),col=`172px repeat(${n},minmax(0,1fr))`,letters=BAR_LETTERS[S.beats/4];
  const ru=$('ruler');ru.style.gridTemplateColumns=col;ru.innerHTML='<span></span>';
  for(let s=0;s<n;s++){const sp=document.createElement('span');
    if(s%16===0){sp.className='bn';sp.textContent=letters[s/16];if(s)sp.style.marginLeft='10px'}
    else if(s%4===0){sp.textContent=(s%16)/4+1;sp.style.marginLeft='3px'}
    ru.appendChild(sp)}
  grid.innerHTML='';cols=Array.from({length:n},()=>[]);
  if(!list.length)grid.innerHTML='<p class="empty">Le kit est vide. Ouvre « Style & kit » pour ajouter des instruments.</p>';
  let prevG=-1;
  list.forEach(tr=>{
    if(prevG!==-1&&tr.g!==prevG){const sp=document.createElement('div');sp.className='gsep';grid.appendChild(sp)}
    prevG=tr.g;
    const rw=document.createElement('div');rw.className='rw';rw.style.gridTemplateColumns=col;
    const th=document.createElement('div');th.className='th';th.style.setProperty('--c',tr.c);
    th.onmouseenter=()=>hl(S.map[tr.id],true);th.onmouseleave=()=>hl(S.map[tr.id],false);
    th.innerHTML=`<button class="tn" title="Écouter">${tr.name}</button><span class="nt">${noteName(S.map[tr.id])}</span>`+
      `<button class="tb lock" title="Verrouiller : la piste ne bouge plus quand tu génères" aria-label="Verrouiller ${tr.name}">${ICON.lock}</button>`+
      `<button class="tb mute" title="Couper" aria-label="Couper ${tr.name}">${ICON.mute}</button>`;
    const [nm,lk,mt]=th.querySelectorAll('button'),rowCells=[];
    nm.onclick=()=>audition(tr.id);
    const sync=()=>{lk.setAttribute('aria-pressed',S.locks.has(tr.id));mt.setAttribute('aria-pressed',S.mutes.has(tr.id));rw.classList.toggle('muted',S.mutes.has(tr.id))};
    lk.onclick=()=>{S.locks.has(tr.id)?S.locks.delete(tr.id):S.locks.add(tr.id);sync();touchRecent()};
    mt.onclick=()=>{S.mutes.has(tr.id)?S.mutes.delete(tr.id):S.mutes.add(tr.id);sync();pushPattern()};
    rw.appendChild(th);
    for(let s=0;s<n;s++){const c=document.createElement('div');c.className='c';c.dataset.t=tr.id;c.dataset.s=s;c.style.setProperty('--col',s);
      if(s%4===0)c.classList.add('q');
      if(s%16===0&&s)c.classList.add('gB');else if(s%4===0&&s)c.classList.add('gb');
      paint(c,S.pat[tr.id][s]);cols[s].push(c);rowCells.push(c);rw.appendChild(c)}
    sync();grid.appendChild(rw)});
  if(fresh){grid.classList.remove('fresh');void grid.offsetWidth;grid.classList.add('fresh');fresh=false;clearTimeout(render.t);render.t=setTimeout(()=>grid.classList.remove('fresh'),800)}
  syncUI();renderRack();touchRecent();renderDots();pushPattern();
}
function paint(c,v){c.style.setProperty('--v',v?(.22+.78*v).toFixed(2):0)} // la luminosité suit la vélocité
function setNow(s){cols[nowStep]?.forEach(c=>c.classList.remove('now'));nowStep=s;
  if(s>=0){cols[s]?.forEach(c=>c.classList.add('now'));
    for(const id of IDS)if(S.kit.has(id)&&!S.mutes.has(id)&&S.pat[id]&&S.pat[id][s]>0)flashPad(S.map[id])}}

/* peindre en glissant sur une ligne, Maj+clic pour une note fantôme */
let painting=null;
function setCell(c,v){const id=c.dataset.t,s=+c.dataset.s;if(S.pat[id][s]===v)return;S.pat[id][s]=v;paint(c,v);if(v)audition(id,v,s)}
grid.addEventListener('pointerdown',e=>{const c=e.target.closest('.c');if(!c||e.button!==0)return;
  const id=c.dataset.t,s=+c.dataset.s,old=S.pat[id][s];const v=e.shiftKey?(old&&old<.5?0:.32):(old?0:.85);
  setCell(c,v);painting={v,row:id};e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!painting)return;const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest&&el.closest('.c');
  if(c&&c.dataset.t===painting.row)setCell(c,painting.v)});
document.addEventListener('pointerup',()=>{if(painting){painting=null;touchRecent();pushPattern()}});
/* molette sur une note allumée : ajuste sa vélocité (sur une case vide, la liste défile normalement) */
let wheelT;
grid.addEventListener('wheel',e=>{const c=e.target.closest('.c');if(!c)return;
  const id=c.dataset.t,s=+c.dataset.s,v=S.pat[id][s];if(!v)return;e.preventDefault();
  const nv=Math.min(1,Math.max(.12,v+(e.deltaY<0?1:-1)*(e.shiftKey?.02:.07)));S.pat[id][s]=nv;paint(c,nv);
  clearTimeout(wheelT);wheelT=setTimeout(()=>{audition(id,nv,s);touchRecent();pushPattern()},250)},{passive:false});

/* ---------- boutons et clavier ---------- */
const _generate=generate;
generate=()=>{fresh=true;_generate()};
$('gen').onclick=()=>{setTab('seq');generate()};
$('drop').onclick=()=>{setTab('seq');fresh=true;tryDrop()};
$('brk').onclick=()=>{setTab('seq');fresh=true;tryBreak()};
$('midi').addEventListener('pointerdown',startMidiDrag);$('midi').addEventListener('dblclick',writeClip);
$('orig').onclick=backToOriginal;
$('back').onclick=back;
$('play').onclick=togglePlay;
$('listen').onclick=()=>{S.listen=!S.listen;$('listen').setAttribute('aria-pressed',S.listen);toMax('live',S.listen?1:0);
  showMsg(S.listen?'Écoute dans le Drum Rack activée':'Écoute coupée : seul le clip joue')};
function back(){const h=S.hist.pop();if(!h)return;S.curId=null;Object.assign(S,h);showSwing();render()}
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k==='Escape'){closePick();closeLen();closeRack();return}
  if(e.target.closest&&e.target.closest('.vb'))return;
  if(k==='g'||k==='G'){setTab('seq');generate()}
  else if(k==='d'||k==='D'){setTab('seq');fresh=true;tryDrop()}
  else if(k==='b'||k==='B'){setTab('seq');fresh=true;tryBreak()}
  else if(k==='w'||k==='W'||k==='e'||k==='E')writeClip();
  else if(k==='z'||k==='Z')back();
  else if(k==='1'||k==='2')setMode(MODES[+k-1][0]);
  else if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();stepGenre(k==='ArrowRight'?1:-1)}
  else if(e.code==='Space'&&!IN_PLUGIN){e.preventDefault();togglePlay()}
});

/* ---------- 5 derniers beats ---------- */
const RECENT_KEY='device.recent2';
const des=e=>({...e,snap:{...e.snap,kit:new Set(e.snap.kit)}});
const ser=e=>({...e,snap:{...e.snap,kit:[...e.snap.kit]}});
let recent=store.get(RECENT_KEY,[]).slice(0,5).map(des),recentN=Math.max(0,...recent.map(e=>e.id));
S.curId=null;
function entryOf(){return{snap:snapshot(),swing:S.swing,locks:[...S.locks],mutes:[...S.mutes]}}
function saveRecent(){store.set(RECENT_KEY,recent.map(ser))}
function record(){const e=entryOf();e.id=++recentN;S.curId=e.id;recent.unshift(e);recent=recent.slice(0,5);saveRecent();renderDots();pushState()}
function touchRecent(){pushState();const i=recent.findIndex(e=>e.id===S.curId);if(i<0)return;const e=entryOf();e.id=S.curId;recent[i]=e;saveRecent()}
function applyEntry(e){const h=e.snap;
  Object.assign(S,{pat:copyPat(h.pat),sig:{...h.sig},seed:h.seed,beats:h.beats,genre:h.genre,mode:h.mode,kit:new Set(h.kit),
    base:h.base&&copyPat(h.base),baseMode:h.baseMode,dropName:h.dropName,dropN:h.dropN,dropFlavor:h.dropFlavor,dropSeed:h.dropSeed,
    derived:h.base?(h.derived||'drop'):'',swing:e.swing,locks:new Set(e.locks||[]),mutes:new Set(e.mutes||[])})}
function restore(id){const e=recent.find(x=>x.id===id);if(!e||id===S.curId)return;pushHist();applyEntry(e);showSwing();S.curId=id;render()}
function renderDots(){const el=$('hdots');el.innerHTML='';
  recent.slice().reverse().forEach(e=>{const h=e.snap,b=document.createElement('button');b.className='hdot';b.dataset.m=modeKey(h);
    b.title=`${GENRE_LABEL[h.genre]} · ${h.base?derivedLabel(h):MODE_NAME[h.mode].toLowerCase()} · ${h.beats} temps`;
    b.setAttribute('aria-label',b.title);b.setAttribute('aria-pressed',e.id===S.curId);b.onclick=()=>restore(e.id);el.appendChild(b)})}

/* ---------- état sauvegardé avec le set Live (par instance du plugin) ---------- */
function exportState(){const e=entryOf();e.id=S.curId;return JSON.stringify({v:2,cur:ser(e),recent:recent.map(ser),map:S.map,mapV:MAP_V,swingClip:S.swingClip,dens:S.dens,dyn:S.dyn,listen:S.listen})}
let stT;function pushState(){if(!JUCE)return;clearTimeout(stT);stT=setTimeout(()=>toMax('state',exportState()),250)}
bindIn('restore',json=>{let o;try{o=JSON.parse(json)}catch(_){return}if(!o||o.v!==2||!o.cur)return; // un état d'avant la refonte est ignoré
  recent=(o.recent||[]).slice(0,5).map(des);recentN=Math.max(0,...recent.map(e=>e.id||0));
  if(o.map&&o.mapV===MAP_V){S.map={...DEFAULT_MAP,...o.map};store.set('map3',S.map)}
  S.swingClip=o.swingClip!==false;$('swClip').setAttribute('aria-checked',S.swingClip);
  if(o.dens!=null){S.dens=o.dens;showDens()}
  if(o.dyn!=null){S.dyn=o.dyn;showDyn()}
  if(o.listen===false){S.listen=false;$('listen').setAttribute('aria-pressed','false');toMax('live',0)}
  const e=des(o.cur);applyEntry(e);S.curId=e.id;showSwing();render()});
bindIn('dragdone',()=>flashWrite());

/* ---------- démarrage ---------- */
$('swClip').setAttribute('aria-checked',S.swingClip);
if(recent.length){S.curId=-1;restore(recent[0].id)}
else{S.seed=Math.floor(Math.random()*99999);fresh=true;build(false);record()}
toMax('ready');toMax('live',1);

</script>
