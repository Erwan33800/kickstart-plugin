<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kickstart</title>
<style>
/* Bande de device Live : 169 px de haut. Colonne réglages, colonne actions, séquenceur. Un seul accent : la LED du type. */
:root{
  --bg:#141518; --surface:#1b1c20; --raised:#24262b; --hover:#2d3036; --line:#2c2f35;
  --fg:#eceae4; --dim:#a0a2a8; --faint:#6b6e75; --cell:#202226; --cell-beat:#272a2f;
  --classic:#5fd4b8; --surprise:#a98cf5; --drop:#ff6b57; --hit:var(--classic);
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;
  --lw:104px; --rh:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;min-height:169px;overflow:hidden;background:var(--bg);color:var(--fg);font:12px/1.3 var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
body[data-mode="surprise"]{--hit:var(--surprise)} body[data-mode="drop"]{--hit:var(--drop)}
button{font:inherit;color:inherit;margin:0}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--fg);outline-offset:1px}
.dev{display:grid;grid-template-columns:232px 132px minmax(0,1fr);gap:10px;height:100%;min-height:169px;padding:8px 10px 8px 10px}
.lab{font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}

/* colonne A */
.colA{display:grid;grid-template-rows:18px 24px 30px 22px 22px;gap:7px;min-width:0}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.brand .led{width:8px;height:8px;border-radius:2px;background:var(--hit);box-shadow:0 0 9px var(--hit);transition:background .25s,box-shadow .25s}
.brand b{font-weight:600;font-size:12.5px;letter-spacing:-.01em}
.tp{margin-left:auto;display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--dim)}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tp.on .tdot{background:var(--fg)}
.play{width:20px;height:18px;border-radius:4px;border:1px solid var(--line);background:var(--raised);font-size:9px;cursor:pointer;padding:0}
.play[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row .lab{width:44px;flex:none}
.stysel{display:flex;align-items:center;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;height:24px}
.arw{width:24px;height:22px;border:0;background:none;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;padding:0}
.arw:hover{color:var(--fg)}
.stname{flex:1;min-width:0;border:0;background:none;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:22px;display:flex;align-items:center;justify-content:center;gap:6px}
.stname::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--hit);box-shadow:0 0 6px var(--hit)}
.stname:hover{background:var(--raised)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.key{--k:var(--classic);display:flex;align-items:center;gap:6px;justify-content:center;border:1px solid var(--line);background:none;border-radius:6px;cursor:pointer;color:var(--dim);font-size:11.5px;font-weight:600;padding:0 4px;white-space:nowrap}
.key[data-v="surprise"]{--k:var(--surprise)} .key[data-v="drop"]{--k:var(--drop)}
.key .l{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.key:hover{color:var(--fg);background:var(--surface)}
.key[aria-checked="true"]{color:var(--fg);border-color:color-mix(in oklab,var(--k) 45%,var(--line));background:color-mix(in oklab,var(--k) 9%,transparent)}
.key[aria-checked="true"] .l{background:var(--k);box-shadow:0 0 8px var(--k)}
.bars{display:flex;gap:3px}
.bar{width:24px;height:18px;border-radius:4px;border:1px solid var(--line);background:none;cursor:pointer;font:10px var(--mono);color:var(--faint);padding:0}
.bar.pre{background:var(--hover);color:var(--fg)}
.bar.on{background:var(--dim);border-color:var(--dim);color:var(--bg)}
.lentxt{font:10.5px var(--mono);color:var(--dim);white-space:nowrap}
.params{gap:6px}
.param{flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:6px;height:22px;padding:0 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);cursor:ns-resize;touch-action:none;position:relative;overflow:hidden}
.param:hover,.param.drag{border-color:var(--faint)}
.param .lab{width:auto;line-height:20px}
.param .pv{font:500 12px var(--mono);line-height:20px}
.param .pbar{position:absolute;left:0;bottom:0;height:2px;background:var(--faint)}
.param.drag .pbar{background:var(--hit)}

/* colonne B */
.colB{display:grid;grid-template-rows:42px 28px 30px 1fr;gap:6px}
.primary,.ghost,.write{border-radius:7px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s,background .2s,border-color .15s,color .15s}
.primary{border:0;background:var(--hit);color:#0f1011;font-size:13.5px}
.ghost{border:1px solid var(--line);background:none;font-size:12px}
.ghost:hover{border-color:var(--drop);color:var(--drop)}
.write{border:1px solid var(--fg);background:none;font-size:12px}
.write:hover{background:var(--fg);color:var(--bg)}
.write.ok{border-color:var(--classic);color:var(--classic)}
.primary:active,.ghost:active,.write:active{transform:scale(.97)}
.tools{display:flex;align-items:center;gap:2px}
.ib{width:24px;height:24px;border-radius:5px;border:0;background:none;color:var(--dim);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:14px;height:14px}
.ib:hover:not(:disabled){background:var(--raised);color:var(--fg)}
.ib:disabled{opacity:.3;cursor:default}
.ib[aria-pressed="false"]{color:var(--faint)}
.ib[aria-pressed="false"] .on,.ib[aria-pressed="true"] .off{display:none}
.hdots{display:flex;gap:3px;margin-left:auto}
.hdot{--mc:var(--classic);width:11px;height:11px;border-radius:3px;border:0;padding:0;cursor:pointer;background:color-mix(in oklab,var(--mc) 35%,var(--surface))}
.hdot[data-m="surprise"]{--mc:var(--surprise)} .hdot[data-m="drop"]{--mc:var(--drop)}
.hdot:hover{background:color-mix(in oklab,var(--mc) 70%,var(--surface))}
.hdot[aria-pressed="true"]{background:var(--mc);box-shadow:0 0 0 1px var(--bg),0 0 0 2px var(--mc)}

/* colonne C : séquenceur */
.colC{position:relative;display:grid;grid-template-rows:20px minmax(0,1fr);gap:5px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px 6px 0}
.chead{display:flex;align-items:center;gap:10px;min-width:0;padding-left:8px}
.kitbtn{border:0;background:none;color:var(--dim);cursor:pointer;padding:2px 6px;border-radius:5px;font-size:11.5px;white-space:nowrap}
.kitbtn b{color:var(--fg);font-weight:600}
.kitbtn:hover{background:var(--raised);color:var(--fg)}
.derive{display:flex;align-items:center;gap:8px;min-width:0;font-size:11.5px;white-space:nowrap}
.dtag{color:var(--drop);font-weight:600}
.link{border:0;background:none;color:var(--dim);cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--hover);text-underline-offset:2px;font-size:11.5px}
.link:hover{color:var(--fg)}
.msg{margin-left:auto;font-size:11.5px;color:var(--classic);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;min-width:0}
.msg.show{opacity:1} .msg.err{color:var(--drop)}
.seed{font:10px var(--mono);color:var(--faint);white-space:nowrap}
.gridwrap{overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin}
.grid{display:grid;column-gap:2px;row-gap:2px}
.th{display:flex;align-items:center;gap:4px;padding:0 4px 0 8px;min-width:0;height:var(--rh);position:relative}
.tn{border:0;background:none;padding:0;cursor:pointer;font-size:min(11px,calc(var(--rh) - 2px));font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;min-width:0;flex:1}
.tn:hover{color:var(--hit)}
.nt{font:min(9.5px,calc(var(--rh) - 3px)) var(--mono);color:var(--faint);flex:none}
.tt{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:none;gap:1px;background:var(--surface)}
.th:hover .tt,.tt.keep{display:flex}
.tb{width:16px;height:min(16px,var(--rh));border:0;border-radius:3px;background:none;color:var(--faint);display:grid;place-items:center;cursor:pointer;padding:0}
.tb svg{width:11px;height:11px}
.tb:hover{background:var(--raised);color:var(--fg)}
.tb.lock[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tb.mute[aria-pressed="true"]{color:var(--drop)}
.th.locked .nt::after{content:" ●";color:var(--fg)}
.th.muted .tn{color:var(--faint);text-decoration:line-through}
.c{position:relative;height:var(--rh);border-radius:3px;background:var(--cell);cursor:pointer;overflow:hidden}
.c.q{background:var(--cell-beat)}
.c::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--v,0) * 100%);background:var(--hit);border-radius:inherit;transform-origin:bottom;transition:height .1s ease-out,background .25s}
.c:hover{box-shadow:inset 0 0 0 1px var(--faint)}
.c.now{background:var(--hover)}
.c.now::after{filter:brightness(1.3)}
.c.m{opacity:.28}
.gb{margin-left:3px} .gB{margin-left:8px}
.sep{margin-top:3px}
.grid.fresh .c::after{animation:grow .3s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--col) * 5ms)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.empty{grid-column:1/-1;color:var(--dim);padding:20px 8px;margin:0}

/* panneaux qui recouvrent le séquenceur */
.ov{position:absolute;inset:27px 0 0 0;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 8px 8px;padding:6px 10px;display:grid;grid-template-rows:16px minmax(0,1fr);gap:6px;z-index:5}
.ovh{display:flex;align-items:center;gap:10px}
.ovh .x{margin-left:auto}
.ovb{min-height:0;overflow-y:auto}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.sopt{border:1px solid var(--line);background:none;border-radius:6px;height:24px;cursor:pointer;color:var(--dim);font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;padding:0 10px}
.sopt::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line)}
.sopt:hover{color:var(--fg);background:var(--raised)}
.sopt[aria-checked="true"]{color:var(--fg);border-color:var(--faint)}
.sopt[aria-checked="true"]::before{background:var(--hit);box-shadow:0 0 6px var(--hit)}
.sopt small{margin-left:auto;font:10px var(--mono);color:var(--faint);font-weight:400}
.kgrid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:none;border-radius:5px;padding:1px 7px;cursor:pointer;color:var(--dim);font-size:11px;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:5px;height:5px;border-radius:1px;background:var(--line)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--faint)}
.chip[aria-pressed="true"]::before{background:var(--hit)}
.pre{border:1px dashed var(--line);background:none;border-radius:999px;padding:2px 9px;cursor:pointer;color:var(--dim);font-size:11.5px}
.pre:hover{color:var(--fg);border-color:var(--dim)}
.pre[aria-pressed="true"]{border-style:solid;border-color:var(--faint);color:var(--fg)}
.setmap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.padwrap{display:grid;gap:3px}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.pad{height:20px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--faint);cursor:pointer;padding:0 4px;display:flex;align-items:center;gap:4px;min-width:0;font-size:10px;text-align:left}
.pad small{font:9px var(--mono);color:var(--faint);flex:none}
.pad span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pad.used{background:var(--raised);color:var(--fg)}
.pad.sel{border-color:var(--hit);box-shadow:inset 0 0 0 1px var(--hit)}
.pad:hover{border-color:var(--dim)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 12px}
.mname{flex:1;min-width:0;border:0;background:none;padding:0;color:var(--dim);cursor:pointer;text-align:left;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mname:hover,.mrow.sel .mname{color:var(--fg)}
.mrow.sel output{color:var(--hit)}
.mrow.out output{color:var(--drop)}
.mrow{display:flex;align-items:center;gap:4px;font-size:11.5px;height:19px}
.step{width:17px;height:17px;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;color:var(--dim);padding:0;line-height:1}
.step:hover{color:var(--fg);border-color:var(--faint)}
.mrow output{font:11px var(--mono);width:34px;text-align:center}
.setrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:0;font-size:12px;color:var(--fg)}
.tog i{width:26px;height:14px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.tog[aria-checked="true"] i{background:color-mix(in oklab,var(--classic) 55%,var(--line))}
.tog[aria-checked="true"] i::after{transform:translateX(12px);background:var(--fg)}
.note{color:var(--faint);font-size:11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-mode="classic">
<div class="dev">
  <section class="colA" aria-label="Réglages">
    <div class="brand">
      <i class="led" aria-hidden="true"></i><b>Kickstart</b>
      <span class="tp" id="tp" title="Tempo de Live"><i class="tdot"></i><span id="tempo">— bpm</span></span>
      <button class="play" id="play" aria-pressed="false" title="Lecture (hors de Live)" hidden>▶</button>
    </div>
    <div class="row"><span class="lab">Style</span>
      <div class="stysel"><button class="arw" id="sPrev" aria-label="Style précédent">‹</button><button class="stname" id="sName" title="Choisir un style"></button><button class="arw" id="sNext" aria-label="Style suivant">›</button></div>
    </div>
    <div class="keys" id="modes" role="radiogroup" aria-label="Type"></div>
    <div class="row"><span class="lab">Long.</span><div class="bars" id="bars" role="radiogroup" aria-label="Longueur"></div><span class="lentxt" id="lentxt"></span></div>
    <div class="row params">
      <div class="param" id="pSwing" role="slider" tabindex="0" aria-label="Swing" title="Glisse ou molette. Double-clic : swing du style."><span class="lab">Swing</span><span class="pv"></span><i class="pbar"></i></div>
      <div class="param" id="pDens" role="slider" tabindex="0" aria-label="Densité" title="Glisse ou molette. Régénère au relâchement."><span class="lab">Densité</span><span class="pv"></span><i class="pbar"></i></div>
    </div>
  </section>

  <section class="colB" aria-label="Actions">
    <button class="primary" id="gen" title="Nouveau pattern (G)">Générer</button>
    <button class="ghost" id="drop" title="Garde la structure et la pousse en drop (D)">Tenter un drop</button>
    <button class="write" id="write" title="Maintiens et glisse vers une piste ou un slot de Live. Double-clic ou E : exporter un .mid">⇲ Glisser le MIDI</button>
    <div class="tools">
      <button class="ib" id="back" disabled aria-label="Annuler" title="Annuler (Z)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 5 3.5 9l4 4"/><path d="M3.5 9h8a5 5 0 0 1 0 10H9"/></svg></button>
      <button class="ib" id="listen" aria-pressed="true" title="Écouter le pattern dans le Drum Rack pendant la lecture de Live">
        <svg class="on" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z"/><path d="M11 6.5c.7.8.7 2.2 0 3M12.8 4.8c1.6 1.8 1.6 4.6 0 6.4"/></svg>
        <svg class="off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z"/><path d="M11 6l4 4M15 6l-4 4"/></svg>
      </button>
      <div class="hdots" id="hdots" aria-label="Derniers beats"></div>
    </div>
  </section>

  <section class="colC" aria-label="Séquenceur">
    <div class="chead">
      <button class="kitbtn" id="kitBtn" title="Choisir les éléments du kit">Kit · <b id="kitName"></b> ▾</button>
      <span class="derive" id="derive" hidden><span class="dtag" id="dtag"></span><button class="link" id="orig">original</button></span>
      <span class="msg" id="msg" role="status"></span>
      <span class="seed" id="seed"></span>
      <button class="ib" id="setBtn" title="Notes MIDI et options d'écriture" aria-label="Réglages"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg></button>
    </div>
    <div class="gridwrap"><div class="grid" id="grid"></div></div>

    <div class="ov" id="ovStyle" hidden>
      <div class="ovh"><span class="lab">Style</span><span class="note">Flèches ← → pour passer de l'un à l'autre</span><button class="ib x" data-close aria-label="Fermer">✕</button></div>
      <div class="ovb"><div class="sgrid" id="sgrid"></div></div>
    </div>
    <div class="ov" id="ovKit" hidden>
      <div class="ovh"><span class="lab">Kit</span><div class="chips" id="presets"></div><button class="ib x" data-close aria-label="Fermer">✕</button></div>
      <div class="ovb"><div class="kgrid" id="kgrid"></div></div>
    </div>
    <div class="ov" id="ovSet" hidden>
      <div class="ovh"><span class="lab">Notes</span>
        <button class="tog" id="swClip" role="switch" aria-checked="true" title="Coupé : grille droite, à swinguer avec un Groove de Live"><i></i>Swing écrit dans le clip</button>
        <button class="link" id="mapReset" style="margin-left:auto">Notes par défaut (C1–D#2)</button>
        <button class="ib x" data-close aria-label="Fermer">✕</button></div>
      <div class="ovb">
        <div class="setmap">
          <div class="padwrap"><div class="pads" id="pads" aria-label="Pads du Drum Rack, C1 en bas à gauche"></div><span class="note" id="padHint"></span></div>
          <div class="mgrid" id="mgrid"></div>
        </div>
      </div>
    </div>
  </section>
</div>
<script>

/* Pistes affichables, dans l'ordre du séquenceur */
const TRACKS=[
  {id:'k',name:'Kick',g:0},{id:'sn',name:'Snare',g:0},{id:'cp',name:'Clap',g:0},{id:'rim',name:'Rim',g:0},
  {id:'ch',name:'Hat fermé',short:'HH f.',g:1},{id:'oh',name:'Hat ouvert',short:'HH o.',g:1},{id:'ride',name:'Ride',g:1},{id:'cb',name:'Cowbell',short:'Cowb.',g:1},
  {id:'shk',name:'Shaker',g:2},{id:'tamb',name:'Tambourin',short:'Tamb.',g:2},
  {id:'pl',name:'Conga grave',short:'Cga gr.',g:3},{id:'pm',name:'Conga médium',short:'Cga méd.',g:3},{id:'ph',name:'Conga aiguë',short:'Cga aig.',g:3},{id:'tom',name:'Toms',g:3}];
const GROUPS=['Fondations','Métaux','Secoués','Peaux'];
const IDS=TRACKS.map(t=>t.id);
const NAME=Object.fromEntries(TRACKS.map(t=>[t.id,t.name]));
/* Si une piste du pattern n'est pas dans le kit, son rôle passe à la première piste dispo de la liste */
const FALLBACK={k:['k'],sn:['sn','cp','rim'],cp:['cp','sn','rim'],rim:['rim'],ch:['ch','shk','tamb'],oh:['oh','ride'],
  ride:['ride'],cb:['cb'],shk:['shk'],tamb:['tamb'],pl:['pl'],pm:['pm','ph','pl'],ph:['ph'],tom:['tom']};
const PRESETS={
  'Essentiel':['k','sn','cp','ch','oh','rim'],
  'Groove house':['k','cp','ch','oh','shk','rim','pm','ph'],
  'Latin':['k','cp','ch','cb','shk','pl','pm','ph','tamb'],
  'Dub':['k','sn','rim','ch','oh','ride','pm','tom'],
  'Breaks':['k','sn','ch','oh','ride','rim','tom'],
  'Tout':IDS};
/* Par style : tempo, swing, delay dub, kick (durée, attaque), et la colonne vertébrale utilisée par « Tenter un drop » */
const GENRE_DEF={

const HINTS={
  classic:"Classique : le groove attendu du style, propre et stable. La base sûre pour poser une idée.",
  surprise:"Surprenant : kicks déplacés, motifs euclidiens, placements en 3-3-2. Ça reste dansant mais ça accroche l'oreille.",
  drop:"Drop : tout le monde joue, hats ouverts pleins, et la dernière mesure monte en roulement pour relancer la boucle."};

const S={genre:'house',mode:'classic',beats:8,bpm:124,swing:54,dens:.6,seed:0,pat:{},sig:{},
  kit:new Set(PRESETS['Groove house']),locks:new Set(),mutes:new Set(),hist:[],
  base:null,baseMode:'',dropName:'',dropN:0,lastFlavor:-1};
const copyPat=p=>Object.fromEntries(Object.entries(p).map(([k,v])=>[k,v.slice()]));
function snapshot(){return{pat:copyPat(S.pat),sig:{...S.sig},seed:S.seed,beats:S.beats,genre:S.genre,mode:S.mode,kit:new Set(S.kit),
  base:S.base&&copyPat(S.base),baseMode:S.baseMode,dropName:S.dropName,dropN:S.dropN,dropFlavor:S.dropFlavor,dropSeed:S.dropSeed}}
function pushHist(){if(Object.keys(S.pat).length){S.hist.push(snapshot());if(S.hist.length>30)S.hist.shift()}}
const steps=()=>S.beats*4;
const active=()=>IDS.filter(id=>S.kit.has(id));

/* ---------- génération ---------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const E=()=>Object.fromEntries(IDS.map(id=>[id,Array(16).fill(0)]));
const set=(b,id,arr,v)=>arr.forEach(s=>b[id][s]=v);
const euclid=(k,n,rot=0)=>Array.from({length:n},(_,i)=>(((i+rot)*k)%n)<k);
const clone=b=>Object.fromEntries(IDS.map(id=>[id,b[id].slice()]));
const each=(e,fn)=>{for(let s=0;s<16;s++)if(e[s%e.length])fn(s)};

/* Éléments additionnels : ride, cowbell, shaker, tambourin, congas grave/aiguë, toms */
const CONGA_LH=["......h.......h.","...h...l...h..l.","..h.h.....h.l...",".h....l..h....l.","..h...h...h.l.h."];
function extras(b,c){
  const G=S.genre,M=S.mode,dub=GENRE_DEF[G].dub;
  // ride
  if(M==='classic'){if(!dub)set(b,'ride',c.pick([[2,6,10,14],[0,4,8,12]]),.45);
    else for(let s=0;s<16;s+=2)b.ride[s]=s%4===2?.5:.32}
  else if(M==='surprise'){const e=euclid(5,8,c.int(8));for(let i=0;i<8;i++)if(e[i])b.ride[i*2]=.45;if(c.maybe(.5))b.ride[c.pick([3,11,15])]=.35}
  else for(let s=0;s<16;s+=2)b.ride[s]=s%4===2?.6:.45;
  // cowbell
  if(M==='classic')set(b,'cb',c.pick(dub?[[3,10],[6,14],[10]]:[[2,10],[6,14],[3,10],[7,14]]),.5);
  else if(M==='surprise'){each(euclid(3,8,c.int(8)),s=>b.cb[s]=s<8?.55:.42);if(c.maybe(.4))b.cb[c.pick([5,13])]=.35}
  else{if(c.r()<.5)set(b,'cb',[2,6,10,14],.55);else each(euclid(5,16,c.int(16)),s=>b.cb[s]=.5)}
  // shaker
  if(M==='classic'){for(let s=0;s<16;s++)if(c.maybe(.9))b.shk[s]=s%2?.38:.22}
  else if(M==='surprise')each(euclid(11,16,c.int(16)),s=>b.shk[s]=s%4===2?.45:.28);
  else for(let s=0;s<16;s++)b.shk[s]=s%2?.5:.3;
  // tambourin
  if(M==='classic'){if(c.r()<.5)set(b,'tamb',GENRE_DEF[G].back,.5);else set(b,'tamb',[2,6,10,14],.42)}
  else if(M==='surprise')each(euclid(3,8,c.int(8)),s=>b.tamb[s]=.45);
  else{set(b,'tamb',[2,6,10,14],.55);set(b,'tamb',[3,11],.32)}
  // congas grave et aiguë (la médium vient de la recette)
  if(M==='classic'){[...c.pick(CONGA_LH)].forEach((ch,s)=>{if(ch!=='.'&&c.maybe(.9))b[ch==='l'?'pl':'ph'][s]=ch==='l'?.6:.55})}
  else if(M==='surprise'){each(euclid(5,16,c.int(16)),s=>{b[c.r()<.4?'pl':'ph'][s]=.55});if(c.maybe(.5))b.ph[c.pick([7,15])]=.35}
  else each(euclid(7,16,c.int(16)),s=>{b[s%4===0?'pl':'ph'][s]=s%4===0?.65:.55});
  // toms : peu dans le groove, surtout dans les fills
  if(M==='surprise'&&c.maybe(.35))b.tom[c.pick([7,14])]=.5;
  if(dub&&M==='classic'&&c.maybe(.25))b.tom[15]=.45;
  return b}

function mutate(b,c){const n=1+c.int(2);
  for(let i=0;i<n;i++){const op=c.int(5);
    if(op===0){const s=1+2*c.int(8);if(!b.oh[s])b.ch[s]=b.ch[s]?0:.3}
    else if(op===1){const hits=b.rim.map((v,s)=>v?s:-1).filter(s=>s>0);
      if(hits.length){const s=c.pick(hits),t=(s+c.pick([1,2,-1,-2])+16)%16;if(t&&!b.rim[t]){b.rim[t]=b.rim[s];b.rim[s]=0}}else b.rim[c.pick([3,7,11])]=.55}
    else if(op===2)b.pm[1+2*c.int(8)]=.42;
    else if(op===3){const s=1+2*c.int(8);b.ph[s]=b.ph[s]?0:.4;b.cb[c.pick([7,15])]=b.cb[c.pick([7,15])]||.35}
    else if(c.maybe(.6))b.k[15]=.55}
  return b}

function fill(b,c){
  if(S.mode==='classic'){c.pick([[13,15],[14,15],[12,14,15]]).forEach((s,i)=>b.sn[s]=.45+i*.12);if(c.maybe(.5))b.oh[14]=0;
    if(c.maybe(.5))set(b,'ph',[13,14,15],.5);if(c.maybe(.4))set(b,'tom',[14,15],.6)}
  else if(S.mode==='surprise'){const e=euclid(5,8,c.int(8));
    for(let s=8;s<16;s++)if(e[s-8])b[c.pick(['pm','sn','ph'])][s]=.5+.05*(s-8);
    set(b,'tom',[12,13,14,15],.0);set(b,'tom',c.pick([[13,14,15],[12,14,15],[14,15]]),.65);
    if(c.maybe(.5)){b.k[12]=0;b.k[14]=.7}}
  else{for(let s=0;s<8;s+=2)b.sn[s]=Math.max(b.sn[s],.28+s*.03);
    for(let s=8;s<16;s++)b.sn[s]=.45+(s-8)*.075;
    set(b,'tom',[13,14,15],.8);
    if(c.maybe(.6))b.k[12]=0;b.oh[14]=0;b.ride[14]=0}
  return b}

/* Construit le pattern brut (toujours toutes les pistes, même tirage) puis le projette sur le kit choisi */
function build(newSeed){
  if(newSeed){pushHist();S.seed=Math.floor(Math.random()*99999)}
  S.base=null;S.dropN=0;
  const r=mulberry(S.seed),f=S.dens*1.6;
  const c={r,maybe:p=>r()<Math.min(1,p*f),int:n=>Math.floor(r()*n),pick:a=>a[Math.floor(r()*a.length)]};
  const A=extras(R[S.genre][S.mode](c),c),B=mutate(clone(A),c),nb=S.beats/4;
  const order={1:[A],2:[A,B],3:[A,A,B],4:[A,B,A,B]}[nb].map(clone);
  if(nb>1)fill(order[nb-1],c);
  const raw=Object.fromEntries(IDS.map(id=>[id,order.flatMap(bar=>bar[id])]));
  // projection sur le kit
  const pat={},sig={},n=steps();
  active().forEach(id=>{pat[id]=Array(n).fill(0);sig[id]=[]});
  IDS.forEach(src=>{const dest=FALLBACK[src].find(t=>S.kit.has(t));if(!dest)return;
    sig[dest].push(src);raw[src].forEach((v,i)=>{if(v>pat[dest][i])pat[dest][i]=v})});
  Object.keys(sig).forEach(id=>sig[id]=sig[id].join('+'));
  // garder les pistes verrouillées, et (si on change seulement le kit) les pistes inchangées avec tes retouches
  active().forEach(id=>{const old=S.pat[id];if(!old)return;
    if(S.locks.has(id))pat[id]=Array.from({length:n},(_,i)=>old[i%old.length]);
    else if(!newSeed&&S.sig[id]===sig[id]&&old.length===n)pat[id]=old});
  S.pat=pat;S.sig=sig;render();
}
let generate=()=>{S.curId=null;build(true);record()};

/* ---------- transformer le pattern actuel en drop ---------- */
const DROPS=[
  {name:'Plein régime',txt:'tout le kit joue, backbeat doublé, roulement de snare en fin de boucle'},
  {name:'Rebond',txt:'kicks de relance, contretemps de percs, descente de toms en fin de boucle'},
  {name:'Montée',txt:'la dernière mesure monte en roulement et le kick respire avant de retomber sur le 1'}];
const MODE_LABEL={classic:'classique',surprise:'surprenant',drop:'drop'};
function tryDrop(){S.curId=null;
  let f;do{f=Math.floor(Math.random()*DROPS.length)}while(f===S.lastFlavor&&DROPS.length>1);
  S.lastFlavor=f;applyDrop(f,Math.floor(Math.random()*99999),(S.base?S.dropN:0)+1,true);record()}
function applyDrop(flavor,seed,n,push){
  if(push)pushHist();
  if(!S.base){S.base=copyPat(S.pat);S.baseMode=S.mode}
  const p=copyPat(S.base),r=mulberry(seed),maybe=x=>r()<x,pick=a=>a[Math.floor(r()*a.length)];
  const N=steps(),nb=Math.max(1,N/16),last=(nb-1)*16;
  const has=id=>!!p[id];
  const put=(id,s,v)=>{if(has(id))p[id][s]=Math.max(p[id][s],Math.min(1,v))};
  const cut=(id,s)=>{if(has(id))p[id][s]=0};
  const first=ids=>ids.find(has);
  // tout le monde un peu plus fort
  for(const id in p)p[id]=p[id].map(v=>v?Math.min(1,v*1.12+.03):0);
  // la colonne vertébrale du drop, posée par-dessus ta structure
  const back=first(['cp','sn','rim']),GD=GENRE_DEF[S.genre];
  for(let s=0;s<N;s++){const b=s%16,q=s%4;
    if(GD.dk.includes(b))put('k',s,1);
    if(GD.back.includes(b)){put(back,s,.95);if(has('cp')&&has('sn'))put('sn',s,.75)}
    if(GD.doh.includes(b)){if(has('oh')){put('oh',s,.85);cut('ch',s)}else{put('ride',s,.7);put('ch',s,.8)}}
    else if(has('ch')&&!p.ch[s]&&maybe(.65))put('ch',s,s%2?.36:.5);
    if(has('shk')&&p.shk.some(v=>v))put('shk',s,s%2?.5:.3)}
  // tes percs gardent leur motif, et le reprennent en écho une demi-mesure plus loin
  ['rim','cb','pl','pm','ph','tamb','ride'].filter(has).forEach(id=>{
    const src=p[id].slice();
    for(let s=0;s<N;s++)if(src[s]&&maybe(.45)){const t=s-s%16+((s%16)+8)%16;if(!p[id][t])p[id][t]=src[s]*.8}});
  // couleur propre à chaque drop
  const roll=(from,to,step)=>{const id=first(['sn','cp','rim']);const span=to-from;
    for(let s=from;s<to;s+=step)put(id,s,.35+.65*((s-from)/span))};
  if(flavor===0){
    for(let s=0;s<N;s++)if(s%4===2)put('tamb',s,.55);
    for(let s=0;s<N;s+=2)put('ride',s,s%4===2?.6:.42);
    nb>1?(roll(last+8,last+12,2),roll(last+12,last+16,1)):roll(12,16,1);
  }else if(flavor===1){
    const perc=first(['ph','pm','cb','pl','rim']);
    for(let bar=0;bar<nb;bar++){const o=bar*16;
      put('k',o+15,.6);if(maybe(.5))put('k',o+pick([7,10]),.7);
      for(let q=3;q<16;q+=4){if(maybe(.5))put(perc,o+q,.45);if(maybe(.4))put('ch',o+q,.55)}}
    const tomId=first(['tom','pl','pm','sn']);[13,14,15].forEach((s,i)=>put(tomId,last+s,.7+i*.1));
  }else{
    if(nb>1){roll(last,last+8,2);roll(last+8,last+16,1);
      for(let s=last+8;s<last+16;s++)cut('k',s);cut('oh',last+14);cut('ride',last+14)}
    else roll(12,16,1);
    put(first(['ride','oh','cb']),0,1);
  }
  // les pistes verrouillées ne bougent pas
  S.locks.forEach(id=>{if(S.base[id])p[id]=S.base[id].slice()});
  S.pat=p;S.dropFlavor=flavor;S.dropSeed=seed;S.dropN=n;S.dropName=DROPS[flavor].name;
  render();
}
function backToOriginal(){if(!S.base)return;S.curId=null;pushHist();S.pat=S.base;S.base=null;S.dropN=0;render()}
function rebuildKit(){
  const was=S.base?{f:S.dropFlavor,seed:S.dropSeed,n:S.dropN}:null;
  if(was)S.pat=S.base;
  build(false);
  if(was)applyDrop(was.f,was.seed,was.n,false)}

let ac,master,noiseBuf,send,dly,ohGain=null;
function initAudio(){

  ac=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;
  master=ac.createGain();master.gain.value=.7;master.connect(comp).connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  send=ac.createGain();dly=ac.createDelay(2);const fb=ac.createGain(),lp=ac.createBiquadFilter();

}
function updDelay(){if(dly)dly.delayTime.value=Math.min(1.9,60/S.bpm/4*3)}

function filt(type,f,q=.7){const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b}

  if(slap){const g2=ac.createGain();env(g2,t,v*.25,.03);nz(t,.04).connect(filt('bandpass',3500,1)).connect(g2);out(g2)}out(g,.3)}
const V={
  k(t,v){const g=ac.createGain(),[L,f0]=GENRE_DEF[S.genre].kick;env(g,t,v*1.1,L);
    const o=ac.createOscillator();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(46,t+.1);o.connect(g);out(g);o.start(t);o.stop(t+L+.05)},
  sn(t,v){const g=ac.createGain();env(g,t,v*.6,.18);nz(t,.2).connect(filt('bandpass',1900,.8)).connect(g);
    const g2=ac.createGain();env(g2,t,v*.45,.1);osc(t,.12,'triangle',200,160,g2);out(g,.3);out(g2)},
  cp(t,v){const g=ac.createGain();g.gain.setValueAtTime(.0001,t);
    for(let i=0;i<3;i++){const tt=t+i*.011;g.gain.setValueAtTime(v*.9,tt);g.gain.exponentialRampToValueAtTime(v*.12,tt+.009)}
    g.gain.setValueAtTime(v*.8,t+.033);g.gain.exponentialRampToValueAtTime(.0001,t+.24);
    nz(t,.26).connect(filt('bandpass',1150,1.2)).connect(g);out(g,.25)},
  rim(t,v){const g=ac.createGain(),bp=filt('bandpass',1700,3);env(g,t,v*.7,.05);
    osc(t,.06,'triangle',1750,0,bp);osc(t,.06,'square',480,0,bp);bp.connect(g);out(g,.45)},
  ch(t,v){if(ohGain){ohGain.gain.cancelScheduledValues(t);ohGain.gain.setTargetAtTime(.0001,t,.008);ohGain=null}
    const g=ac.createGain();env(g,t,v*.42,.045);nz(t,.06).connect(filt('highpass',7500)).connect(g);out(g)},
  oh(t,v){const g=ac.createGain();env(g,t,v*.38,.32);nz(t,.35).connect(filt('highpass',7000)).connect(g);out(g);ohGain=g},
  ride(t,v){const g=ac.createGain(),hp=filt('highpass',5200);env(g,t,v*.16,.55);
    [1,1.34,1.71,2.29].forEach(r=>osc(t,.6,'square',420*r,0,hp));
    const g2=ac.createGain();env(g2,t,v*.12,.4);nz(t,.45).connect(filt('bandpass',9000,.9)).connect(g2);hp.connect(g);out(g);out(g2)},
  cb(t,v){const g=ac.createGain(),bp=filt('bandpass',800,2.2);env(g,t,v*.55,.22);
    osc(t,.25,'square',545,0,bp);osc(t,.25,'square',815,0,bp);bp.connect(g);out(g,.35)},
  shk(t,v){const g=ac.createGain();env(g,t,v*.32,.07,.012);nz(t,.09).connect(filt('bandpass',6200,.9)).connect(g);out(g)},
  tamb(t,v){const g=ac.createGain();env(g,t,v*.3,.16,.004);nz(t,.18).connect(filt('highpass',8200)).connect(g);
    const g2=ac.createGain(),bp=filt('bandpass',7000,6);env(g2,t,v*.12,.12);osc(t,.14,'square',6800,0,bp);bp.connect(g2);out(g);out(g2)},
  pl(t,v){conga(t,v,175,.32,false)},
  pm(t,v){conga(t,v,255,.24,false)},

  el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,base:get()};committed=get();el.setPointerCapture(e.pointerId);el.classList.add('drag');e.preventDefault()});
  el.addEventListener('pointermove',e=>{if(!drag)return;apply(drag.base+((e.clientX-drag.x)-(e.clientY-drag.y))/(e.shiftKey?sens*4:sens))});
  const end=()=>{if(!drag)return;drag=null;el.classList.remove('drag');done()};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{e.preventDefault();apply(get()+(e.deltaY<0?1:-1)*(e.shiftKey?5:1));later()},{passive:false});
  el.addEventListener('keydown',e=>{const k={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1}[e.key];if(!k)return;e.preventDefault();e.stopPropagation();apply(get()+k*(e.shiftKey?10:1));later()});
  el.addEventListener('dblclick',()=>{apply(reset());later()});
  show();return show}
const showSwing=param($('pSwing'),{min:50,max:75,sens:5,get:()=>S.swing,set:v=>{S.swing=v},fmt:v=>v+'%',reset:()=>GENRE_DEF[S.genre].swing,commit:()=>{pushPattern();touchRecent()}});
const showDens=param($('pDens'),{min:0,max:100,sens:2,get:()=>Math.round(S.dens*100),set:v=>{S.dens=v/100},fmt:v=>String(v),reset:()=>60,commit:()=>generate()});

/* ---------- style, type, longueur ---------- */
const modesEl=$('modes'),barsEl=$('bars'),sgrid=$('sgrid');
MODES.forEach(([m,name],i)=>{const b=document.createElement('button');b.className='key';b.dataset.v=m;b.setAttribute('role','radio');
  b.title=`${name} (${i+1})`;b.innerHTML=`<span class="l"></span>${name}`;b.onclick=()=>setMode(m);modesEl.appendChild(b)});
[1,2,3,4].forEach(n=>{const b=document.createElement('button');b.className='bar';b.textContent=n;b.setAttribute('role','radio');
  b.setAttribute('aria-label',`${n} mesure${n>1?'s':''}`);b.onclick=()=>setBeats(n*4);b.onpointerenter=()=>previewBars(n);barsEl.appendChild(b)});
barsEl.onpointerleave=()=>previewBars(0);
function previewBars(n){[...barsEl.children].forEach((b,i)=>b.classList.toggle('pre',i<n));$('lentxt').textContent=`${(n||S.beats/4)*4} temps`}
GENRE_ORDER.forEach(g=>{const b=document.createElement('button');b.className='sopt';b.dataset.v=g;b.setAttribute('role','radio');
  b.innerHTML=`${GENRE_LABEL[g]}<small>${GENRE_DEF[g].bpm}</small>`;b.onclick=()=>{setGenre(g);closeOv()};sgrid.appendChild(b)});
$('sName').onclick=()=>openOv('ovStyle');
$('sPrev').onclick=()=>stepGenre(-1);$('sNext').onclick=()=>stepGenre(1);
function stepGenre(d){const i=GENRE_ORDER.indexOf(S.genre);setGenre(GENRE_ORDER[(i+d+GENRE_ORDER.length)%GENRE_ORDER.length])}
function setGenre(g){if(g===S.genre)return;S.genre=g;const d=GENRE_DEF[g];S.swing=d.swing;if(!IN_MAX){S.bpm=d.bpm;$('tempo').textContent=S.bpm+' bpm'}updDelay();showSwing();generate()}
function setMode(m){S.mode=m;generate()}
function setBeats(b){if(b===S.beats)return;S.beats=b;generate()}
function syncUI(){
  $('sName').textContent=GENRE_LABEL[S.genre];$('sName').title=GENRE_DEF[S.genre].desc;
  sgrid.querySelectorAll('.sopt').forEach(b=>b.setAttribute('aria-checked',b.dataset.v===S.genre));
  modesEl.querySelectorAll('.key').forEach(b=>b.setAttribute('aria-checked',b.dataset.v===S.mode));
  [...barsEl.children].forEach((b,i)=>{b.classList.toggle('on',i<S.beats/4);b.setAttribute('aria-checked',(i+1)*4===S.beats)});
  $('lentxt').textContent=`${S.beats} temps`;
  document.body.dataset.mode=S.base?'drop':S.mode;
}

/* ---------- panneaux ---------- */
let openId=null;
function openOv(id){closeOv();openId=id;$(id).hidden=false;if(id==='ovKit')renderKitOv();if(id==='ovSet')renderSetOv()}
function closeOv(){if(openId)$(openId).hidden=true;openId=null}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeOv);
$('kitBtn').onclick=()=>openId==='ovKit'?closeOv():openOv('ovKit');
$('setBtn').onclick=()=>openId==='ovSet'?closeOv():openOv('ovSet');

const GROUP_NAMES=['Fondations','Métaux','Secoués','Peaux'];
function renderKitOv(){
  const pr=$('presets');pr.innerHTML='';const cur=IDS.filter(id=>S.kit.has(id)).join(',');
  Object.entries(PRESETS).forEach(([name,ids])=>{const b=document.createElement('button');b.className='pre';b.textContent=name;
    b.setAttribute('aria-pressed',ids.join(',')===cur);b.onclick=()=>{S.kit=new Set(ids);rebuildKit();renderKitOv()};pr.appendChild(b)});
  const kg=$('kgrid');kg.innerHTML='';
  GROUP_NAMES.forEach((gn,gi)=>{kg.insertAdjacentHTML('beforeend',`<span class="lab">${gn}</span>`);const ch=document.createElement('div');ch.className='chips';
    TRACKS.filter(t=>t.g===gi).forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t.name;b.setAttribute('aria-pressed',S.kit.has(t.id));
      b.onclick=()=>{const on=!S.kit.has(t.id);on?S.kit.add(t.id):(S.kit.delete(t.id),S.locks.delete(t.id));rebuildKit();renderKitOv();if(on)audition(t.id,.8)};ch.appendChild(b)});
    kg.appendChild(ch)})}
/* Réglage des notes : grille 4x4 comme le Drum Rack (C1 en bas à gauche) + liste des éléments */
let selEl=null;
function setNote(id,p){S.map[id]=Math.min(127,Math.max(0,p));store.set('map2',S.map);pushPattern();render();renderSetOv();audition(id,.8)}
function renderSetOv(){
  $('swClip').setAttribute('aria-checked',S.swingClip);
  const pads=$('pads');pads.innerHTML='';
  for(let row=3;row>=0;row--)for(let col=0;col<4;col++){
    const n=PAD_LO+row*4+col,els=TRACKS.filter(t=>S.map[t.id]===n||(t.id==='tom'&&TOM_OFF.some(o=>S.map.tom+o===n)));
    const b=document.createElement('button');b.className='pad';b.dataset.n=n;
    if(els.length)b.classList.add('used');if(selEl&&els.some(t=>t.id===selEl))b.classList.add('sel');
    b.innerHTML=`<small>${noteName(n)}</small><span>${els.map(t=>t.short||t.name).join(' · ')||'—'}</span>`;
    b.title=selEl?`Mettre ${NAME[selEl]} sur ${noteName(n)}`:`${noteName(n)}${els.length?' : '+els.map(t=>t.name).join(', '):' (libre)'}`;
    b.onclick=()=>{if(selEl)setNote(selEl,n);else if(els[0]){selEl=els[0].id;renderSetOv();audition(els[0].id,.8)}};
    pads.appendChild(b)}
  const mg=$('mgrid');mg.innerHTML='';
  TRACKS.forEach(t=>{const out=S.map[t.id]<PAD_LO||S.map[t.id]>PAD_HI;
    const r=document.createElement('div');r.className='mrow'+(selEl===t.id?' sel':'')+(out?' out':'');
    r.innerHTML=`<button class="mname" title="Choisir, puis clique un pad">${t.name}</button><button class="step" aria-label="Note plus grave">−</button><output>${noteName(S.map[t.id])}</output><button class="step" aria-label="Note plus aiguë">+</button>`;
    const [nm,m,p]=r.querySelectorAll('button'),o=r.querySelector('output');
    nm.onclick=()=>{selEl=selEl===t.id?null:t.id;renderSetOv();if(selEl)audition(t.id,.8)};
    m.onclick=()=>setNote(t.id,S.map[t.id]-1);p.onclick=()=>setNote(t.id,S.map[t.id]+1);
    o.title=out?`Note MIDI ${S.map[t.id]} : hors des 16 pads, muette sur un Drum Rack standard`:`Note MIDI ${S.map[t.id]}`;mg.appendChild(r)});
  $('padHint').textContent=selEl?`${NAME[selEl]} : clique le pad où il doit jouer.`:'Clique un élément, puis le pad de ton Drum Rack où il doit jouer.'}
$('swClip').onclick=()=>{S.swingClip=!S.swingClip;store.set('swingClip',S.swingClip);$('swClip').setAttribute('aria-checked',S.swingClip);pushPattern()};
$('mapReset').onclick=()=>{S.map={...DEFAULT_MAP};selEl=null;store.set('map2',S.map);renderSetOv();render();pushPattern()};

/* ---------- séquenceur ---------- */
let cols=[],fresh=false;
const grid=$('grid');
function render(){
  const n=steps(),list=TRACKS.filter(t=>S.kit.has(t.id));
  const groups=new Set(list.map(t=>t.g)).size,avail=grid.parentElement.clientHeight||124;
  const rh=Math.max(9,Math.min(18,Math.floor((avail-(groups-1)*3-(list.length-1)*2)/Math.max(1,list.length))));
  document.documentElement.style.setProperty('--rh',rh+'px');
  grid.style.gridTemplateColumns=`var(--lw) repeat(${n},minmax(0,1fr))`;
  grid.innerHTML='';cols=Array.from({length:n},()=>[]);
  if(!list.length)grid.innerHTML='<p class="empty">Le kit est vide. Ouvre « Kit » pour ajouter des éléments.</p>';
  let prevG=-1;
  list.forEach(tr=>{
    const newGroup=prevG!==-1&&tr.g!==prevG;prevG=tr.g;
    const th=document.createElement('div');th.className='th'+(newGroup?' sep':'');
    const pitch=S.map[tr.id];
    th.innerHTML=`<button class="tn" title="Écouter">${tr.name}</button><span class="nt">${noteName(pitch)}</span>`+
      `<span class="tt"><button class="tb lock" title="Verrouiller : la piste ne bouge plus quand tu génères">${ICON.lock}</button><button class="tb mute" title="Couper">${ICON.mute}</button><button class="tb rm" title="Retirer du kit">${ICON.rm}</button></span>`;
    const [nm,lk,mt,rm]=th.querySelectorAll('button');
    nm.onclick=()=>audition(tr.id);
    const rowCells=[];
    const sync=()=>{lk.setAttribute('aria-pressed',S.locks.has(tr.id));mt.setAttribute('aria-pressed',S.mutes.has(tr.id));
      th.classList.toggle('locked',S.locks.has(tr.id));th.classList.toggle('muted',S.mutes.has(tr.id));
      th.querySelector('.tt').classList.toggle('keep',S.locks.has(tr.id)||S.mutes.has(tr.id));rowCells.forEach(c=>c.classList.toggle('m',S.mutes.has(tr.id)))};
    lk.onclick=()=>{S.locks.has(tr.id)?S.locks.delete(tr.id):S.locks.add(tr.id);sync();touchRecent()};
    mt.onclick=()=>{S.mutes.has(tr.id)?S.mutes.delete(tr.id):S.mutes.add(tr.id);sync();pushPattern()};
    rm.onclick=()=>{S.kit.delete(tr.id);S.locks.delete(tr.id);rebuildKit()};
    grid.appendChild(th);
    for(let s=0;s<n;s++){const c=document.createElement('div');c.className='c'+(newGroup?' sep':'');
      c.dataset.t=tr.id;c.dataset.s=s;c.style.setProperty('--col',s);
      if(s%16===0&&s)c.classList.add('gB');else if(s%4===0&&s)c.classList.add('gb');
      if(s%4===0)c.classList.add('q');
      paint(c,S.pat[tr.id][s]);cols[s].push(c);rowCells.push(c);grid.appendChild(c)}
    sync()});
  if(fresh){grid.classList.remove('fresh');void grid.offsetWidth;grid.classList.add('fresh');fresh=false;clearTimeout(render.t);render.t=setTimeout(()=>grid.classList.remove('fresh'),800)}
  $('seed').textContent='#'+String(S.seed).padStart(5,'0');
  $('back').disabled=!S.hist.length;
  const cur=IDS.filter(id=>S.kit.has(id)).join(',');
  $('kitName').textContent=(Object.entries(PRESETS).find(([,ids])=>ids.join(',')===cur)||['Perso'])[0];
  const d=$('derive');d.hidden=!S.base;if(S.base){$('dtag').textContent=`Drop ${S.dropName.toLowerCase()} · v${S.dropN}`;$('dtag').title=DROPS[S.dropFlavor].txt+` (sur ton pattern ${MODE_LABEL[S.baseMode]})`}
  syncUI();touchRecent();renderDots();pushPattern();
}
function paint(c,v){c.style.setProperty('--v',v?Math.max(.2,v).toFixed(2):0)}
function setNow(s){cols[nowStep]?.forEach(c=>c.classList.remove('now'));nowStep=s;if(s>=0)cols[s]?.forEach(c=>c.classList.add('now'))}

/* peindre en glissant sur une ligne, Maj+clic pour une note fantôme */
let painting=null;
function setCell(c,v){const id=c.dataset.t,s=+c.dataset.s;if(S.pat[id][s]===v)return;S.pat[id][s]=v;paint(c,v);if(v)audition(id,v,s)}
grid.addEventListener('pointerdown',e=>{const c=e.target.closest('.c');if(!c||e.button!==0)return;
  const id=c.dataset.t,s=+c.dataset.s,old=S.pat[id][s];const v=e.shiftKey?(old&&old<.5?0:.32):(old?0:.85);
  setCell(c,v);painting={v,row:id};e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!painting)return;const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest&&el.closest('.c');
  if(c&&c.dataset.t===painting.row)setCell(c,painting.v)});
document.addEventListener('pointerup',()=>{if(painting){painting=null;touchRecent();pushPattern()}});

/* ---------- boutons et clavier ---------- */
const _generate=generate;
generate=()=>{fresh=true;_generate()};
$('gen').onclick=()=>generate();
$('drop').onclick=()=>{fresh=true;tryDrop()};
$('write').addEventListener('pointerdown',startDrag);$('write').addEventListener('dblclick',writeClip);
$('orig').onclick=backToOriginal;
$('back').onclick=back;
$('play').onclick=togglePlay;
$('listen').onclick=()=>{S.listen=!S.listen;$('listen').setAttribute('aria-pressed',S.listen);toMax('live',S.listen?1:0);
  showMsg(S.listen?'Écoute dans le Drum Rack activée':'Écoute coupée : seul le clip joue')};
function back(){const h=S.hist.pop();if(!h)return;S.curId=null;Object.assign(S,h);showSwing();render()}
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k==='Escape'){closeOv();return}
  if(k==='g'||k==='G')generate();
  else if(k==='d'||k==='D'){fresh=true;tryDrop()}
  else if(k==='w'||k==='W'||k==='e'||k==='E')writeClip();
  else if(k==='z'||k==='Z')back();
  else if(k==='1'||k==='2'||k==='3')setMode(MODES[+k-1][0]);
  else if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();stepGenre(k==='ArrowRight'?1:-1)}
  else if(e.code==='Space'&&!IN_MAX){e.preventDefault();togglePlay()}
});

/* ---------- 5 derniers beats ---------- */
const RECENT_KEY='device.recent';
let recent=store.get(RECENT_KEY,[]).slice(0,5).map(e=>({...e,snap:{...e.snap,kit:new Set(e.snap.kit)}})),recentN=Math.max(0,...recent.map(e=>e.id));
S.curId=null;
function entryOf(){return{snap:snapshot(),swing:S.swing,locks:[...S.locks],mutes:[...S.mutes]}}
function saveRecent(){store.set(RECENT_KEY,recent.map(e=>({...e,snap:{...e.snap,kit:[...e.snap.kit]}})))}
function record(){const e=entryOf();e.id=++recentN;S.curId=e.id;recent.unshift(e);recent=recent.slice(0,5);saveRecent();renderDots();pushState()}
function touchRecent(){pushState();const i=recent.findIndex(e=>e.id===S.curId);if(i<0)return;const e=entryOf();e.id=S.curId;recent[i]=e;saveRecent()}
function restore(id){const e=recent.find(x=>x.id===id);if(!e||id===S.curId)return;pushHist();const h=e.snap;
  Object.assign(S,{pat:copyPat(h.pat),sig:{...h.sig},seed:h.seed,beats:h.beats,genre:h.genre,mode:h.mode,kit:new Set(h.kit),
    base:h.base&&copyPat(h.base),baseMode:h.baseMode,dropName:h.dropName,dropN:h.dropN,dropFlavor:h.dropFlavor,dropSeed:h.dropSeed,
    swing:e.swing,locks:new Set(e.locks),mutes:new Set(e.mutes||[])});
  showSwing();S.curId=id;render()}
function renderDots(){const el=$('hdots');el.innerHTML='';
  recent.slice().reverse().forEach(e=>{const h=e.snap,b=document.createElement('button');b.className='hdot';b.dataset.m=h.base?'drop':h.mode;
    b.title=`${GENRE_LABEL[h.genre]} · ${h.base?'drop '+h.dropName.toLowerCase():MODE_NAME[h.mode].toLowerCase()} · ${h.beats} temps`;
    b.setAttribute('aria-label',b.title);b.setAttribute('aria-pressed',e.id===S.curId);b.onclick=()=>restore(e.id);el.appendChild(b)})}

/* ---------- état sauvegardé avec le set Live (par instance du plugin) ---------- */
const ser=e=>({...e,snap:{...e.snap,kit:[...e.snap.kit]}});
const des=e=>({...e,snap:{...e.snap,kit:new Set(e.snap.kit)}});
function exportState(){const e=entryOf();e.id=S.curId;return JSON.stringify({v:1,cur:ser(e),recent:recent.map(ser),map:S.map,mapV:MAP_V,swingClip:S.swingClip,dens:S.dens,listen:S.listen})}
let stT;function pushState(){if(!JUCE)return;clearTimeout(stT);stT=setTimeout(()=>toMax('state',exportState()),250)}
bindIn('restore',json=>{let o;try{o=JSON.parse(json)}catch(_){return}if(!o||!o.cur)return;
  recent=(o.recent||[]).slice(0,5).map(des);recentN=Math.max(0,...recent.map(e=>e.id||0));
  if(o.map&&o.mapV===MAP_V)S.map={...DEFAULT_MAP,...o.map};S.swingClip=o.swingClip!==false;
  if(o.dens!=null){S.dens=o.dens;showDens()}
  if(o.listen===false){S.listen=false;$('listen').setAttribute('aria-pressed','false');toMax('live',0)}
  const e=des(o.cur),h=e.snap;
  Object.assign(S,{pat:copyPat(h.pat),sig:{...h.sig},seed:h.seed,beats:h.beats,genre:h.genre,mode:h.mode,kit:new Set(h.kit),
    base:h.base&&copyPat(h.base),baseMode:h.baseMode,dropName:h.dropName,dropN:h.dropN,dropFlavor:h.dropFlavor,dropSeed:h.dropSeed,
    swing:e.swing,locks:new Set(e.locks||[]),mutes:new Set(e.mutes||[])});
  S.curId=e.id;showSwing();render()});
bindIn('dragdone',()=>flashWrite());

/* ---------- démarrage ---------- */
if(recent.length){S.curId=-1;restore(recent[0].id)}
else{S.seed=Math.floor(Math.random()*99999);fresh=true;build(false);record()}
toMax('ready');toMax('live',1);

</script>
</body>
</html>
