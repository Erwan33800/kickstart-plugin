<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kickstart</title>
<style>
/* Bande de device Live : 169 px de haut. Colonne réglages, colonne actions, séquenceur. Un seul accent : la LED du type. */
:root{
  --bg:#141518; --surface:#1b1c20; --raised:#24262b; --hover:#2d3036; --line:#2c2f35;
  --fg:#eceae4; --dim:#a0a2a8; --faint:#6b6e75; --cell:#202226; --cell-beat:#272a2f;
  --classic:#5fd4b8; --surprise:#a98cf5; --drop:#ff6b57; --hit:var(--classic);
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;
  --lw:104px; --rh:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;min-height:169px;overflow:hidden;background:var(--bg);color:var(--fg);font:12px/1.3 var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
body[data-mode="surprise"]{--hit:var(--surprise)} body[data-mode="drop"]{--hit:var(--drop)}
button{font:inherit;color:inherit;margin:0}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--fg);outline-offset:1px}
.dev{display:grid;grid-template-columns:232px 132px minmax(0,1fr);gap:10px;height:100%;min-height:169px;padding:8px 10px 8px 10px}
.lab{font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}

/* colonne A */
.colA{display:grid;grid-template-rows:18px 24px 30px 22px 22px;gap:7px;min-width:0}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.brand .led{width:8px;height:8px;border-radius:2px;background:var(--hit);box-shadow:0 0 9px var(--hit);transition:background .25s,box-shadow .25s}
.brand b{font-weight:600;font-size:12.5px;letter-spacing:-.01em}
.tp{margin-left:auto;display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--dim)}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tp.on .tdot{background:var(--fg)}
.play{width:20px;height:18px;border-radius:4px;border:1px solid var(--line);background:var(--raised);font-size:9px;cursor:pointer;padding:0}
.play[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row .lab{width:44px;flex:none}
.stysel{display:flex;align-items:center;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;height:24px}
.arw{width:24px;height:22px;border:0;background:none;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;padding:0}
.arw:hover{color:var(--fg)}
.stname{flex:1;min-width:0;border:0;background:none;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:22px;display:flex;align-items:center;justify-content:center;gap:6px}
.stname::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--hit);box-shadow:0 0 6px var(--hit)}
.stname:hover{background:var(--raised)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.key{--k:var(--classic);display:flex;align-items:center;gap:6px;justify-content:center;border:1px solid var(--line);background:none;border-radius:6px;cursor:pointer;color:var(--dim);font-size:11.5px;font-weight:600;padding:0 4px;white-space:nowrap}
.key[data-v="surprise"]{--k:var(--surprise)} .key[data-v="drop"]{--k:var(--drop)}
.key .l{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.key:hover{color:var(--fg);background:var(--surface)}
.key[aria-checked="true"]{color:var(--fg);border-color:color-mix(in oklab,var(--k) 45%,var(--line));background:color-mix(in oklab,var(--k) 9%,transparent)}
.key[aria-checked="true"] .l{background:var(--k);box-shadow:0 0 8px var(--k)}
.bars{display:flex;gap:3px}
.bar{width:24px;height:18px;border-radius:4px;border:1px solid var(--line);background:none;cursor:pointer;font:10px var(--mono);color:var(--faint);padding:0}
.bar.pre{background:var(--hover);color:var(--fg)}
.bar.on{background:var(--dim);border-color:var(--dim);color:var(--bg)}
.lentxt{font:10.5px var(--mono);color:var(--dim);white-space:nowrap}
.params{gap:6px}
.param{flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:6px;height:22px;padding:0 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);cursor:ns-resize;touch-action:none;position:relative;overflow:hidden}
.param:hover,.param.drag{border-color:var(--faint)}
.param .lab{width:auto;line-height:20px}
.param .pv{font:500 12px var(--mono);line-height:20px}
.param .pbar{position:absolute;left:0;bottom:0;height:2px;background:var(--faint)}
.param.drag .pbar{background:var(--hit)}

/* colonne B */
.colB{display:grid;grid-template-rows:42px 28px 30px 1fr;gap:6px}
.primary,.ghost,.write{border-radius:7px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s,background .2s,border-color .15s,color .15s}
.primary{border:0;background:var(--hit);color:#0f1011;font-size:13.5px}
.ghost{border:1px solid var(--line);background:none;font-size:12px}
.ghost:hover{border-color:var(--drop);color:var(--drop)}
.write{border:1px solid var(--fg);background:none;font-size:12px}
.write:hover{background:var(--fg);color:var(--bg)}
.write.ok{border-color:var(--classic);color:var(--classic)}
.primary:active,.ghost:active,.write:active{transform:scale(.97)}
.tools{display:flex;align-items:center;gap:2px}
.ib{width:24px;height:24px;border-radius:5px;border:0;background:none;color:var(--dim);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:14px;height:14px}
.ib:hover:not(:disabled){background:var(--raised);color:var(--fg)}
.ib:disabled{opacity:.3;cursor:default}
.ib[aria-pressed="false"]{color:var(--faint)}
.ib[aria-pressed="false"] .on,.ib[aria-pressed="true"] .off{display:none}
.hdots{display:flex;gap:3px;margin-left:auto}
.hdot{--mc:var(--classic);width:11px;height:11px;border-radius:3px;border:0;padding:0;cursor:pointer;background:color-mix(in oklab,var(--mc) 35%,var(--surface))}
.hdot[data-m="surprise"]{--mc:var(--surprise)} .hdot[data-m="drop"]{--mc:var(--drop)}
.hdot:hover{background:color-mix(in oklab,var(--mc) 70%,var(--surface))}
.hdot[aria-pressed="true"]{background:var(--mc);box-shadow:0 0 0 1px var(--bg),0 0 0 2px var(--mc)}

/* colonne C : séquenceur */
.colC{position:relative;display:grid;grid-template-rows:20px minmax(0,1fr);gap:5px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px 6px 0}
.chead{display:flex;align-items:center;gap:10px;min-width:0;padding-left:8px}
.kitbtn{border:0;background:none;color:var(--dim);cursor:pointer;padding:2px 6px;border-radius:5px;font-size:11.5px;white-space:nowrap}
.kitbtn b{color:var(--fg);font-weight:600}
.kitbtn:hover{background:var(--raised);color:var(--fg)}
.derive{display:flex;align-items:center;gap:8px;min-width:0;font-size:11.5px;white-space:nowrap}
.dtag{color:var(--drop);font-weight:600}
.link{border:0;background:none;color:var(--dim);cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--hover);text-underline-offset:2px;font-size:11.5px}
.link:hover{color:var(--fg)}
.msg{margin-left:auto;font-size:11.5px;color:var(--classic);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;min-width:0}
.msg.show{opacity:1} .msg.err{color:var(--drop)}
.seed{font:10px var(--mono);color:var(--faint);white-space:nowrap}
.gridwrap{overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin}
.grid{display:grid;column-gap:2px;row-gap:2px}
.th{display:flex;align-items:center;gap:4px;padding:0 4px 0 8px;min-width:0;height:var(--rh);position:relative}
.tn{border:0;background:none;padding:0;cursor:pointer;font-size:min(11px,calc(var(--rh) - 2px));font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;min-width:0;flex:1}
.tn:hover{color:var(--hit)}
.nt{font:min(9.5px,calc(var(--rh) - 3px)) var(--mono);color:var(--faint);flex:none}
.tt{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:none;gap:1px;background:var(--surface)}
.th:hover .tt,.tt.keep{display:flex}
.tb{width:16px;height:min(16px,var(--rh));border:0;border-radius:3px;background:none;color:var(--faint);display:grid;place-items:center;cursor:pointer;padding:0}
.tb svg{width:11px;height:11px}
.tb:hover{background:var(--raised);color:var(--fg)}
.tb.lock[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tb.mute[aria-pressed="true"]{color:var(--drop)}
.th.locked .nt::after{content:" ●";color:var(--fg)}
.th.muted .tn{color:var(--faint);text-decoration:line-through}
.c{position:relative;height:var(--rh);border-radius:3px;background:var(--cell);cursor:pointer;overflow:hidden}
.c.q{background:var(--cell-beat)}
.c::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--v,0) * 100%);background:var(--hit);border-radius:inherit;transform-origin:bottom;transition:height .1s ease-out,background .25s}
.c:hover{box-shadow:inset 0 0 0 1px var(--faint)}
.c.now{background:var(--hover)}
.c.now::after{filter:brightness(1.3)}
.c.m{opacity:.28}
.gb{margin-left:3px} .gB{margin-left:8px}
.sep{margin-top:3px}
.grid.fresh .c::after{animation:grow .3s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--col) * 5ms)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.empty{grid-column:1/-1;color:var(--dim);padding:20px 8px;margin:0}

/* panneaux qui recouvrent le séquenceur */
.ov{position:absolute;inset:27px 0 0 0;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 8px 8px;padding:6px 10px;display:grid;grid-template-rows:16px minmax(0,1fr);gap:6px;z-index:5}
.ovh{display:flex;align-items:center;gap:10px}
.ovh .x{margin-left:auto}
.ovb{min-height:0;overflow-y:auto}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.sopt{border:1px solid var(--line);background:none;border-radius:6px;height:24px;cursor:pointer;color:var(--dim);font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;padding:0 10px}
.sopt::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line)}
.sopt:hover{color:var(--fg);background:var(--raised)}
.sopt[aria-checked="true"]{color:var(--fg);border-color:var(--faint)}
.sopt[aria-checked="true"]::before{background:var(--hit);box-shadow:0 0 6px var(--hit)}
.sopt small{margin-left:auto;font:10px var(--mono);color:var(--faint);font-weight:400}
.kgrid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:none;border-radius:5px;padding:1px 7px;cursor:pointer;color:var(--dim);font-size:11px;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:5px;height:5px;border-radius:1px;background:var(--line)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--faint)}
.chip[aria-pressed="true"]::before{background:var(--hit)}
.pre{border:1px dashed var(--line);background:none;border-radius:999px;padding:2px 9px;cursor:pointer;color:var(--dim);font-size:11.5px}
.pre:hover{color:var(--fg);border-color:var(--dim)}
.pre[aria-pressed="true"]{border-style:solid;border-color:var(--faint);color:var(--fg)}
.setmap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.padwrap{display:grid;gap:3px}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.pad{height:20px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--faint);cursor:pointer;padding:0 4px;display:flex;align-items:center;gap:4px;min-width:0;font-size:10px;text-align:left}
.pad small{font:9px var(--mono);color:var(--faint);flex:none}
.pad span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pad.used{background:var(--raised);color:var(--fg)}
.pad.sel{border-color:var(--hit);box-shadow:inset 0 0 0 1px var(--hit)}
.pad:hover{border-color:var(--dim)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 12px}
.mname{flex:1;min-width:0;border:0;background:none;padding:0;color:var(--dim);cursor:pointer;text-align:left;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mname:hover,.mrow.sel .mname{color:var(--fg)}
.mrow.sel output{color:var(--hit)}
.mrow.out output{color:var(--drop)}
.mrow{display:flex;align-items:center;gap:4px;font-size:11.5px;height:19px}
.step{width:17px;height:17px;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;color:var(--dim);padding:0;line-height:1}
.step:hover{color:var(--fg);border-color:var(--faint)}
.mrow output{font:11px var(--mono);width:34px;text-align:center}
.setrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:0;font-size:12px;color:var(--fg)}
.tog i{width:26px;height:14px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.tog[aria-checked="true"] i{background:color-mix(in oklab,var(--classic) 55%,var(--line))}
.tog[aria-checked="true"] i::after{transform:translateX(12px);background:var(--fg)}
.note{color:var(--faint);font-size:11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-mode="classic">
<div class="dev">
  <section class="colA" aria-label="Réglages">
    <div class="brand">
      <i class="led" aria-hidden="true"></i><b>Kickstart</b>
      <span class="tp" id="tp" title="Tempo de Live"><i class="tdot"></i><span id="tempo">— bpm</span></span>
      <button class="play" id="play" aria-pressed="false" title="Lecture (hors de Live)" hidden>▶</button>
    </div>
    <div class="row"><span class="lab">Style</span>
      <div class="stysel"><button class="arw" id="sPrev" aria-label="Style précédent">‹</button><button class="stname" id="sName" title="Choisir un style"></button><button class="arw" id="sNext" aria-label="Style suivant">›</button></div>
    </div>
    <div class="keys" id="modes" role="radiogroup" aria-label="Type"></div>
    <div class="row"><span class="lab">Long.</span><div class="bars" id="bars" role="radiogroup" aria-label="Longueur"></div><span class="lentxt" id="lentxt"></span></div>
    <div class="row params">
      <div class="param" id="pSwing" role="slider" tabindex="0" aria-label="Swing" title="Glisse ou molette. Double-clic : swing du style."><span class="lab">Swing</span><span class="pv"></span><i class="pbar"></i></div>
      <div class="param" id="pDens" role="slider" tabindex="0" aria-label="Densité" title="Glisse ou molette. Régénère au relâchement."><span class="lab">Densité</span><span class="pv"></span><i class="pbar"></i></div>
    </div>
  </section>

  <section class="colB" aria-label="Actions">
    <button class="primary" id="gen" title="Nouveau pattern (G)">Générer</button>
    <button class="ghost" id="drop" title="Garde la structure et la pousse en drop (D)">Tenter un drop</button>
    <button class="write" id="write" title="Maintiens et glisse vers une piste ou un slot de Live. Double-clic ou E : exporter un .mid">⇲ Glisser le MIDI</button>
    <div class="tools">
      <button class="ib" id="back" disabled aria-label="Annuler" title="Annuler (Z)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 5 3.5 9l4 4"/><path d="M3.5 9h8a5 5 0 0 1 0 10H9"/></svg></button>
      <button class="ib" id="listen" aria-pressed="true" title="Écouter le pattern dans le Drum Rack pendant la lecture de Live">
        <svg class="on" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z"/><path d="M11 6.5c.7.8.7 2.2 0 3M12.8 4.8c1.6 1.8 1.6 4.6 0 6.4"/></svg>
        <svg class="off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z"/><path d="M11 6l4 4M15 6l-4 4"/></svg>
      </button>
      <div class="hdots" id="hdots" aria-label="Derniers beats"></div>
    </div>
  </section>

  <section class="colC" aria-label="Séquenceur">
    <div class="chead">
      <button class="kitbtn" id="kitBtn" title="Choisir les éléments du kit">Kit · <b id="kitName"></b> ▾</button>
      <span class="derive" id="derive" hidden><span class="dtag" id="dtag"></span><button class="link" id="orig">original</button></span>
      <span class="msg" id="msg" role="status"></span>
      <span class="seed" id="seed"></span>
      <button class="ib" id="setBtn" title="Notes MIDI et options d'écriture" aria-label="Réglages"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg></button>
    </div>
    <div class="gridwrap"><div class="grid" id="grid"></div></div>

    <div class="ov" id="ovStyle" hidden>
      <div class="ovh"><span class="lab">Style</span><span class="note">Flèches ← → pour passer de l'un à l'autre</span><button class="ib x" data-close aria-label="Fermer">✕</button></div>
      <div class="ovb"><div class="sgrid" id="sgrid"></div></div>
    </div>
    <div class="ov" id="ovKit" hidden>
      <div class="ovh"><span class="lab">Kit</span><div class="chips" id="presets"></div><button class="ib x" data-close aria-label="Fermer">✕</button></div>
      <div class="ovb"><div class="kgrid" id="kgrid"></div></div>
    </div>
    <div class="ov" id="ovSet" hidden>
      <div class="ovh"><span class="lab">Notes</span>
        <button class="tog" id="swClip" role="switch" aria-checked="true" title="Coupé : grille droite, à swinguer avec un Groove de Live"><i></i>Swing écrit dans le clip</button>
        <button class="link" id="mapReset" style="margin-left:auto">Notes par défaut (C1–D#2)</button>
        <button class="ib x" data-close aria-label="Fermer">✕</button></div>
      <div class="ovb">
        <div class="setmap">
          <div class="padwrap"><div class="pads" id="pads" aria-label="Pads du Drum Rack, C1 en bas à gauche"></div><span class="note" id="padHint"></span></div>
          <div class="mgrid" id="mgrid"></div>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
