<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kickstart</title>
<style>
/* Police Manrope (SIL OFL), intégrée en base64 par build_ui.py */
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url(data:font/woff2;base64,__MANROPE__) format("woff2")}
/* Fenêtre 1120 x 740, redimensionnable. En-tête (logo, barre du beat, onglets Pattern / Style & kit), un grand panneau,
   barre d'actions. Onglet Pattern : Rack (2 banques de 16 pads) au-dessus du séquenceur et de sa bande de réglages.
   Look plat, tuiles arrondies, nom d'instrument coloré, un seul accent selon le type. */
:root{
  --bg:#151516; --panel:#1d1d1f; --tile:#2a2a2d; --tile-hi:#343438; --cell:#28282b; --cell-beat:#313135; --line:#2c2c30;
  --fg:#f1f0ee; --dim:#a4a4aa; --faint:#6f6f77;
  --classic:#5fd4b8; --surprise:#a98cf5; --drop:#ff6b57; --break:#f5b94d; --hit:var(--classic);
  --sans:"Manrope","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;min-width:980px;min-height:620px;overflow:hidden;background:var(--bg);color:var(--fg);font:500 13px/1.35 var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
body[data-mode="surprise"]{--hit:var(--surprise)} body[data-mode="drop"]{--hit:var(--drop)} body[data-mode="break"]{--hit:var(--break)}
button{font:inherit;color:inherit;margin:0;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--fg);outline-offset:1px}
.win{height:100%;display:grid;grid-template-rows:54px minmax(0,1fr) 74px}
.lab{font-size:11px;font-weight:600;color:var(--faint);white-space:nowrap}

/* en-tête */
.top{display:flex;align-items:center;gap:12px;padding:0 14px;min-width:0}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.07em;font-size:14px;width:148px;flex:none}
.mark{width:26px;height:26px;border-radius:6px;border:1.8px solid var(--hit);display:grid;place-items:center;transition:border-color .25s}
.mark svg{width:15px;height:15px;stroke:var(--hit);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
.beatbar{flex:1;min-width:0;height:32px;border-radius:8px;border:0;background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 12px;font-size:12px;color:var(--dim);text-align:left}
.beatbar:hover{background:var(--tile)}
.beatbar svg{width:14px;height:14px;flex:none;stroke:var(--faint);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.beatbar b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.beatbar .sd{margin-left:auto;font:11px var(--mono);color:var(--faint)}
.tabs{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--panel)}
.tab{border:0;background:none;color:var(--faint);height:28px;padding:0 13px;border-radius:7px;font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--tile-hi);color:var(--fg)}
.sq{display:flex;align-items:center;gap:6px}
.readout{display:flex;align-items:center;gap:7px;height:32px;padding:0 4px 0 2px;font:12px var(--mono);color:var(--faint)}
.readout b{color:var(--fg);font-weight:500}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--tile-hi)}
.readout.on .tdot{background:var(--hit)}
.ib{width:32px;height:32px;border:0;background:var(--panel);border-radius:8px;display:grid;place-items:center;color:var(--dim);padding:0}
.ib:hover:not(:disabled){color:var(--fg);background:var(--tile)}
.ib:disabled{opacity:.3;cursor:default}
.ib svg{width:15px;height:15px}
.ib[aria-pressed="true"]{color:var(--hit)}
.ib[aria-pressed="true"] .off,.ib[aria-pressed="false"] .on{display:none}

/* panneau principal */
.mid{display:grid;padding:0 14px 12px;min-height:0}
.seq{display:grid;grid-template-rows:minmax(0,1fr);min-width:0;min-height:0}
.view{min-height:0;min-width:0;position:relative}
.panel{background:var(--panel);border-radius:10px;padding:12px 16px}
#vSeq{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}
#vSeq>.panel:last-child{min-height:0;display:grid;grid-template-rows:minmax(0,1fr)}
.sec{display:grid;gap:8px}

/* tuiles */
.tile{border:0;background:var(--tile);border-radius:8px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:7px 10px 8px;color:var(--fg);transition:background .1s}
.tile small{font:500 10.5px var(--mono);color:var(--faint)}
.tile b{font-size:12.5px;font-weight:600;line-height:1.1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tile:hover{background:var(--tile-hi)}
.tile:active{transform:scale(.98)}
.tile[aria-checked="true"]{background:var(--hit);color:#101012}
.tile[aria-checked="true"] small{color:#101012;opacity:.6}
.pads{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.sty{height:58px}

/* bande de réglages du séquenceur */
.seqv{display:grid;grid-template-rows:auto auto 18px minmax(0,1fr);gap:0;min-height:0}
.seqv>.strip{grid-row:1}
.seqv>.derive{grid-row:2;margin-top:8px}
.seqv>.ruler{grid-row:3;margin-top:10px}
.seqv>.rows{grid-row:4;margin-top:4px}
.strip{display:flex;align-items:center;gap:16px;min-width:0}
.fld{display:flex;align-items:center;gap:8px;position:relative}
.segc{display:flex;gap:2px;padding:2px;border-radius:7px;background:var(--bg)}
.segc button{border:0;background:none;height:26px;padding:0 12px;border-radius:5px;color:var(--faint);font-weight:600;font-size:12px}
.segc button:hover{color:var(--fg)}
.segc button[aria-checked="true"]{background:var(--hit);color:#101012}
.vb{position:relative;height:28px;min-width:54px;padding:0 11px;border-radius:7px;background:var(--tile);display:flex;align-items:center;justify-content:center;font:500 12px var(--mono);cursor:ns-resize;overflow:hidden;touch-action:none;color:var(--fg)}
.vb:hover,.vb.drag{background:var(--tile-hi)}
.vb .pbar{position:absolute;left:0;bottom:0;height:2px;background:var(--faint)}
.vb.drag .pbar{background:var(--hit)}
.vb.sel{cursor:pointer;justify-content:space-between;gap:10px;min-width:122px;font:600 12px var(--sans);border:0}
.vb.sel svg{width:10px;height:10px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu{position:absolute;top:34px;left:0;min-width:200px;padding:4px;border-radius:9px;background:var(--tile-hi);box-shadow:0 10px 28px rgba(0,0,0,.55);z-index:20;display:grid;gap:1px}
.mi{border:0;background:none;height:28px;border-radius:6px;padding:0 10px;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:12.5px;font-weight:600;text-align:left}
.mi small{font:10.5px var(--mono);color:var(--faint);font-weight:400}
.mi:hover{background:var(--tile)}
.mi[aria-checked="true"]{color:var(--hit)}
.kitlink{margin-left:auto;border:0;background:var(--tile);height:28px;border-radius:7px;padding:0 12px;font-size:12px;color:var(--dim);white-space:nowrap}
.kitlink b{color:var(--fg);font-weight:600}
.kitlink:hover{background:var(--tile-hi)}
.derive{display:flex;align-items:center;gap:10px;font-size:12px;height:20px}
.derive .tag{color:var(--hit);font-weight:700}
.link{border:0;background:none;color:var(--dim);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--tile-hi);padding:0;font-size:12px}
.link:hover{color:var(--fg)}

/* séquenceur */
.ruler{display:grid;column-gap:2px;align-items:end}
.ruler span{font:10px var(--mono);color:var(--faint);padding-left:2px;white-space:nowrap}
.ruler .bn{color:var(--dim);font-weight:600}
.rows{display:flex;flex-direction:column;gap:3px;min-height:0;overflow-y:auto;scrollbar-width:thin}
.rw{display:grid;column-gap:2px;align-items:stretch;flex:1 1 0;min-height:17px;max-height:32px}
.gsep{flex:none;height:4px}
.th{display:flex;align-items:center;gap:6px;padding-right:6px;min-width:0}
.tn{border:0;background:none;padding:0;text-align:left;font-size:12.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c)}
.tn:hover{filter:brightness(1.2)}
.nt{font:10px var(--mono);color:var(--faint)}
.tb{width:20px;height:20px;border:0;border-radius:4px;background:none;color:var(--faint);display:grid;place-items:center;padding:0;opacity:.6}
.tb svg{width:12px;height:12px}
.tb:hover{opacity:1;color:var(--fg);background:var(--tile)}
.tb[aria-pressed="true"]{opacity:1}
.tb.lock[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tb.mute[aria-pressed="true"]{color:var(--drop);background:color-mix(in oklab,var(--drop) 16%,transparent)}
.rw.muted .tn{color:var(--faint);text-decoration:line-through}
.empty{color:var(--dim);padding:20px 0;margin:0}
.c{border-radius:3px;background:var(--cell);position:relative;overflow:hidden;cursor:pointer;min-width:0}
.c.q{background:var(--cell-beat)}
.c::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--hit);opacity:var(--v,0);transition:opacity .12s,background .25s}
.c:hover{box-shadow:inset 0 0 0 1px var(--faint)}
.c.now{box-shadow:inset 0 0 0 1px var(--fg)}
.c.now::after{filter:brightness(1.3)}
.rw.muted .c{opacity:.3}
.gb{margin-left:3px}.gB{margin-left:10px}
.grid.fresh .c::after{animation:pop .3s ease-out both;animation-delay:calc(var(--col)*4ms)}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* style & kit */
.pane{display:grid;gap:20px;align-content:start;height:100%;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pre{border:0;background:var(--tile);border-radius:999px;padding:5px 13px;color:var(--dim);font-size:12px;font-weight:600}
.pre:hover{background:var(--tile-hi);color:var(--fg)}
.pre[aria-pressed="true"]{background:var(--hit);color:#101012}
.kg{display:grid;grid-template-columns:90px 1fr;gap:10px 14px;align-items:center}
.chip{height:34px;border-radius:8px;border:0;background:var(--tile);padding:0 14px;color:var(--faint);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:9px}
.chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--tile-hi)}
.chip:hover{background:var(--tile-hi)}
.chip[aria-pressed="true"]{color:var(--c)}
.chip[aria-pressed="true"]::before{background:var(--c)}

/* rack */
.rackv{display:grid;gap:9px}
.rackh{display:flex;align-items:center;gap:12px}
.rackh .link{margin-left:auto}
.pgrid{display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:58px;gap:6px}
.mp{border-radius:8px;background:var(--tile);display:flex;flex-direction:column;justify-content:space-between;padding:6px 10px 8px;min-width:0;min-height:0;position:relative;cursor:pointer;transition:background .1s}
.mp small{font:500 10.5px var(--mono);color:var(--dim)}
.mp .slot{display:flex;flex-direction:column;gap:1px;min-height:0;align-items:flex-start}
.mp.free{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.mp.free .slot::after{content:"vide";color:var(--faint);font-size:12px}
.mp.over{background:var(--hit)}
.mp.over small,.mp.over .slot::after{color:#101012}
.mp.hl{box-shadow:inset 0 0 0 1.5px var(--hit)}
.mp.hit::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--fg);opacity:.22;animation:fl .2s ease-out forwards;pointer-events:none}
@keyframes fl{to{opacity:0}}
.chg{position:absolute;top:4px;right:5px;width:22px;height:22px;border:0;border-radius:5px;background:none;color:var(--faint);display:grid;place-items:center;padding:0}
.chg svg{width:10px;height:10px}
.mp:hover .chg{color:var(--fg);background:rgba(255,255,255,.08)}
.mp.over .chg{color:#101012}
.pick{top:calc(100% + 4px);width:480px;grid-template-columns:repeat(3,1fr);padding:6px;gap:1px 6px;max-height:300px;overflow:auto}
.pick.r{left:auto;right:0}
.pick .mi[aria-checked="true"]{background:var(--tile)}
.pel{display:inline-flex;align-items:center;gap:5px;color:var(--c);font-size:13px;font-weight:700;cursor:grab;touch-action:none;white-space:nowrap;user-select:none;line-height:1.25}
.pel:hover{filter:brightness(1.25)}
.mp.over .pel{color:#101012}
.pel.ghost{position:fixed;z-index:50;pointer-events:none;cursor:grabbing;background:var(--tile-hi);padding:6px 12px;border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.6);transform:translate(-14px,-14px) rotate(-2deg)}
.pel.src{opacity:.25}
.tog{display:inline-flex;align-items:center;gap:9px;border:0;background:none;padding:0;font-size:12.5px;color:var(--fg);font-weight:600}
.tog i{width:30px;height:16px;border-radius:99px;background:var(--tile-hi);position:relative;transition:.15s}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--dim);transition:.15s}
.tog[aria-checked="true"] i{background:var(--hit)}
.tog[aria-checked="true"] i::after{transform:translateX(14px);background:#101012}

/* barre d'actions */
.act{display:flex;align-items:center;gap:12px;padding:0 14px}
.gen{height:50px;width:180px;border:0;border-radius:10px;background:var(--hit);color:#101012;font-weight:800;font-size:15px;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .06s,background .25s}
.gen:hover{filter:brightness(1.08)}
.gen:active{transform:scale(.98)}
.gen kbd,.dropb kbd{font:500 10.5px var(--mono);border-radius:4px;padding:1px 6px;background:rgba(0,0,0,.18)}
.dropb,.brkb{height:50px;width:150px;border-radius:10px;border:0;background:color-mix(in oklab,var(--drop) 14%,var(--panel));color:var(--drop);font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:9px}
.dropb kbd{background:color-mix(in oklab,var(--drop) 18%,transparent)}
.dropb:hover{background:color-mix(in oklab,var(--drop) 24%,var(--panel))}
.dropb:active{transform:scale(.98)}
.brkb{background:color-mix(in oklab,var(--break) 14%,var(--panel));color:var(--break)}
.brkb kbd{background:color-mix(in oklab,var(--break) 18%,transparent)}
.brkb:hover{background:color-mix(in oklab,var(--break) 24%,var(--panel))}
.brkb:active{transform:scale(.98)}
.hist{display:grid;gap:6px;margin-left:4px}
.hd{display:flex;gap:5px;align-items:center;min-height:18px}
.hdot{--mc:var(--classic);width:18px;height:18px;border-radius:5px;border:0;padding:0;background:color-mix(in oklab,var(--mc) 30%,var(--panel))}
.hdot[data-m="surprise"]{--mc:var(--surprise)} .hdot[data-m="drop"]{--mc:var(--drop)} .hdot[data-m="break"]{--mc:var(--break)}
.hdot:hover{background:color-mix(in oklab,var(--mc) 65%,var(--panel))}
.hdot[aria-pressed="true"]{background:var(--mc);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--mc)}
.midi{margin-left:auto;height:50px;display:flex;align-items:center;gap:11px;padding:0 14px 0 10px;border-radius:10px;border:0;background:var(--panel);cursor:grab;text-align:left}
.midi:hover{background:var(--tile)}
.midi.ok{box-shadow:inset 0 0 0 1.5px var(--classic)}
.file{width:28px;height:34px;border-radius:4px 9px 4px 4px;background:var(--tile-hi);display:grid;place-items:center;font:700 8.5px var(--mono);color:var(--hit);letter-spacing:.04em}
.midi b{display:block;font-size:12.5px;font-weight:700}
.midi small{display:block;color:var(--faint);font-size:10.5px;margin-top:1px;font-weight:500}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,8px);max-width:80%;background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:99px;font-weight:700;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--drop);color:#101012}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-mode="classic">
<div class="win">
  <header class="top">
    <div class="logo"><span class="mark"><svg viewBox="0 0 16 16"><path d="M2 12.5 6 4l3 6 2-3 3 5.5"/></svg></span>KICKSTART</div>
    <button class="beatbar" id="beatbar" title="Choisir le style et le kit"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3"/><circle cx="5.7" cy="5.7" r=".6" fill="currentColor"/><circle cx="10.3" cy="10.3" r=".6" fill="currentColor"/><circle cx="8" cy="8" r=".6" fill="currentColor"/></svg><b id="desc"></b><span class="sd" id="seed"></span></button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="seq" aria-selected="true">Pattern</button>
      <button class="tab" role="tab" data-tab="style" aria-selected="false">Style &amp; kit</button>
    </div>
    <div class="sq">
      <div class="readout" id="tp" title="Tempo de Live"><span class="tdot"></span><b id="bpm">—</b>bpm</div>
      <button class="ib" id="play" aria-pressed="false" title="Lecture (hors de Live)" aria-label="Lecture" hidden>
        <svg class="off" viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 3v10l8-5z"/></svg><svg class="on" viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3.5" width="3" height="9" rx=".6"/><rect x="9" y="3.5" width="3" height="9" rx=".6"/></svg>
      </button>
      <button class="ib" id="listen" aria-pressed="true" title="Écouter le pattern dans le Drum Rack pendant la lecture de Live" aria-label="Écoute">
        <svg class="on" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z"/><path d="M11 6.5c.7.8.7 2.2 0 3M12.8 4.8c1.6 1.8 1.6 4.6 0 6.4"/></svg>
        <svg class="off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z"/><path d="M11 6l4 4M15 6l-4 4"/></svg>
      </button>
    </div>
  </header>

  <div class="mid"><section class="seq" aria-label="Panneau principal">
    <div class="view" id="vSeq">
      <div class="panel"><div class="rackv">
        <div class="rackh"><span class="lab">Rack</span><div class="segc" id="banks" role="radiogroup" aria-label="Banque de pads"></div><span class="lab">Glisse un instrument sur un pad, ou clique ⌄ pour le choisir</span><button class="link" id="mapReset">Ordre par défaut</button><button class="tog" id="swClip" role="switch" aria-checked="true" title="Coupé : grille droite, à swinguer avec un Groove de Live"><i></i>Swing écrit dans le clip</button></div>
        <div class="pgrid" id="pgrid"></div>
      </div></div>
      <div class="panel"><div class="seqv">
        <div class="strip">
          <div class="fld"><span class="lab">Type</span><div class="segc" id="types" role="radiogroup" aria-label="Type"></div></div>
          <div class="fld"><span class="lab">Longueur</span>
            <button class="vb sel" id="lenBtn" aria-haspopup="listbox" aria-expanded="false"><span id="lenTxt"></span><svg viewBox="0 0 10 10"><path d="M2 3.5 5 6.5l3-3"/></svg></button>
            <div class="menu" id="lenMenu" role="listbox" hidden></div>
          </div>
          <div id="fSwing"></div><div id="fDens"></div><div id="fDyn"></div>
          <button class="kitlink" id="kitLink" title="Changer de kit">Kit · <b id="kitName"></b> ▾</button>
        </div>
        <div class="derive" id="derive" hidden><span class="tag" id="dtag"></span><button class="link" id="orig">revenir à l'original</button></div>
        <div class="ruler" id="ruler"></div><div class="rows grid" id="grid"></div>
      </div></div>
    </div>

    <div class="view panel" id="vStyle" hidden><div class="pane">
      <div class="sec"><span class="lab">Style · un clic génère un nouveau beat</span><div class="pads" id="styles" role="radiogroup" aria-label="Style"></div></div>
      <div class="sec"><span class="lab">Kit</span><div class="chips" id="presets"></div></div>
      <div class="kg" id="kgrid"></div>
    </div></div>
  </section></div>

  <footer class="act">
    <button class="gen" id="gen" title="Nouveau pattern (G)">Générer <kbd>G</kbd></button>
